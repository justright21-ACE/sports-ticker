<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap">
<!--
  SPORTS TICKER  -  powered by SportsBlaze (free, no API key)
  -------------------------------------------------------------
  Written in old-style JavaScript (no fetch, no arrow functions)
  so it runs on older Samsung TV / monitor web browsers.

  QUICK SETTINGS: edit the CONFIG block below, OR add options to
  the page address, for example:
     index.html?leagues=nfl,nba&fav=DAL,SA
     index.html?demo=1           (fake games, to test the layout)
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #05070d;
    color: #f2f4f8;
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shift { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  /* ---------- header ---------- */
  #top {
    position: absolute; top: 0; left: 0; right: 0;
    height: 9vh;
    background: #0b1020;
    border-bottom: 0.35vh solid #f5b800;
  }
  #brand {
    position: absolute; left: 2.5vw; top: 0; line-height: 9vh;
    font-size: 4.6vh; font-weight: 700; letter-spacing: 0.25vw;
    text-transform: uppercase;
  }
  #brand span { color: #f5b800; }
  #tabs { position: absolute; left: 0; right: 0; top: 0; text-align: center; line-height: 9vh; }
  .tab {
    display: inline-block; vertical-align: middle;
    margin: 0 0.6vw; padding: 0 1.4vw;
    height: 5vh; line-height: 5vh;
    font-size: 3.2vh; font-weight: 600; letter-spacing: 0.15vw;
    color: #6f7a94; border-radius: 0.6vh;
  }
  .tab.on { background: #f5b800; color: #05070d; }
  .tab.empty { color: #2e3548; }
  #clock {
    position: absolute; right: 2.5vw; top: 0; line-height: 9vh; text-align: right;
    font-size: 4.6vh; font-weight: 600;
  }
  #clock small { font-size: 2.6vh; color: #8892aa; margin-right: 1vw; font-weight: 500; }

  /* ---------- main board ---------- */
  #board { position: absolute; top: 9vh; left: 0; right: 0; bottom: 13vh; padding: 2.4vh 1.6vw 0 1.6vw; }
  #heading { height: 6vh; line-height: 6vh; padding: 0 0.6vw; }
  #heading .lg { font-size: 5vh; font-weight: 700; letter-spacing: 0.2vw; }
  #heading .sub { font-size: 3vh; color: #8892aa; margin-left: 1.2vw; font-weight: 500; }
  #heading .page { float: right; font-size: 2.6vh; color: #6f7a94; }
  #cards { margin-top: 1.4vh; }

  .card {
    display: inline-block; vertical-align: top;
    width: 22.6vw; margin: 0 0.6vw 2.2vh 0.6vw;
    background: #111829; border-radius: 1vh; overflow: hidden;
    border: 0.3vh solid #1b2338;
  }
  .card.fav { border-color: #f5b800; }
  .card.live { border-color: #e23d3d; }
  .card.live.fav { border-color: #f5b800; }
  .row { position: relative; height: 8.4vh; line-height: 8.4vh; padding: 0 1.1vw; }
  .row + .row { border-top: 0.2vh solid #1b2338; }
  .abbr {
    display: inline-block; vertical-align: middle;
    min-width: 5.6vw; height: 5.4vh; line-height: 5.4vh; text-align: center;
    background: #1f2a44; border-radius: 0.6vh;
    font-size: 3.9vh; font-weight: 700; letter-spacing: 0.1vw;
  }
  .name {
    display: inline-block; vertical-align: middle;
    max-width: 7.8vw; margin-left: 0.9vw;
    font-size: 2.5vh; color: #a5aec4; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 3vh;
  }
  .rk { color: #f5b800; font-weight: 700; margin-right: 0.4vw; }
  .score { position: absolute; right: 1.1vw; top: 0; font-size: 6vh; font-weight: 700; }
  .lose .score, .lose .abbr { color: #6f7a94; }
  .status {
    height: 4.8vh; line-height: 4.8vh; padding: 0 1.1vw;
    background: #0b1020; font-size: 2.8vh; font-weight: 600; letter-spacing: 0.1vw;
    color: #a5aec4; text-transform: uppercase;
  }
  .live .status { background: #3a0f14; color: #ffd5d5; }
  .lines {
    height: 4vh; line-height: 4vh; padding: 0 1.1vw;
    border-top: 0.2vh solid #1b2338; white-space: nowrap; overflow: hidden;
    font-size: 2.5vh; font-weight: 600; color: #c9d0e0;
  }
  .lines .lbl { color: #f5b800; font-size: 2vh; letter-spacing: 0.15vw; margin-right: 0.8vw; }
  .lines .ou { float: right; }
  .dot {
    display: inline-block; width: 1.4vh; height: 1.4vh; border-radius: 50%;
    background: #ff4545; margin-right: 0.7vw; vertical-align: middle; position: relative; top: -0.2vh;
    -webkit-animation: pulse 1.6s infinite; animation: pulse 1.6s infinite;
  }
  @-webkit-keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }

  #msg {
    display: none; position: absolute; top: 34vh; left: 10vw; right: 10vw;
    text-align: center; font-size: 4.4vh; color: #a5aec4; line-height: 6vh;
  }
  #msg small { display: block; font-size: 2.8vh; color: #6f7a94; margin-top: 1.5vh; line-height: 4vh; }

  /* ---------- bottom crawl ---------- */
  #crawlbar {
    position: absolute; left: 0; right: 0; bottom: 4vh; height: 9vh;
    background: #0b1020; border-top: 0.35vh solid #f5b800; overflow: hidden;
  }
  #crawllabel {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
    background: #f5b800; color: #05070d; padding: 0 1.6vw;
    line-height: 9vh; font-size: 3.6vh; font-weight: 700; letter-spacing: 0.15vw;
  }
  #crawl {
    position: absolute; top: 0; left: 0; white-space: nowrap;
    line-height: 9vh; font-size: 3.8vh; font-weight: 600;
  }
  #crawl .lg { color: #f5b800; margin: 0 1.2vw 0 3vw; font-weight: 700; }
  #crawl .g { margin-right: 2.6vw; }
  #crawl .st { color: #8892aa; margin-left: 0.6vw; font-weight: 500; }
  #crawl .lv { color: #ff6b6b; }
  @-webkit-keyframes crawl { from { -webkit-transform: translateX(0); } to { -webkit-transform: translateX(-50%); } }
  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4vh; line-height: 4vh;
    padding: 0 2.5vw; font-size: 2.2vh; color: #555f78;
  }
  #foot .r { float: right; }

  /* =========== THEMES (picked automatically by day, see CONFIG.theme) =========== */

  /* Chicago Bears: navy + orange (Sunday - Friday) */
  body.t-bears { background: #050a14; }
  .t-bears #top, .t-bears #crawlbar { background: #0B162A; border-color: #C83803; }
  .t-bears #brand span, .t-bears #crawl .lg, .t-bears .rk { color: #E65C1E; }
  .t-bears .tab { color: #7d8aa6; }
  .t-bears .tab.on { background: #C83803; color: #ffffff; }
  .t-bears .tab.empty { color: #26324a; }
  .t-bears .card { background: #0f1d36; border-color: #1b2c4c; }
  .t-bears .row + .row { border-color: #1b2c4c; }
  .t-bears .abbr { background: #1a2d52; }
  .t-bears .status { background: #0B162A; }
  .t-bears .lines { border-color: #1b2c4c; }
  .t-bears .lines .lbl { color: #E65C1E; }
  .t-bears .card.fav { border-color: #C83803; }
  .t-bears .card.live { border-color: #ff3b3b; }
  .t-bears .card.live.fav { border-color: #C83803; }
  .t-bears #crawllabel { background: #C83803; color: #ffffff; }

  /* USC Trojans: cardinal + gold (Saturday) */
  body.t-usc { background: #120304; }
  .t-usc #top, .t-usc #crawlbar { background: #990000; border-color: #FFC72C; }
  .t-usc #brand, .t-usc #clock { color: #ffffff; }
  .t-usc #brand span, .t-usc #crawl .lg, .t-usc .rk { color: #FFC72C; }
  .t-usc #clock small { color: #ffd9a0; }
  .t-usc .tab { color: #f0b9b0; }
  .t-usc .tab.on { background: #FFC72C; color: #990000; }
  .t-usc .tab.empty { color: #6b1a1a; }
  .t-usc #heading .sub, .t-usc #heading .page { color: #c9a9a3; }
  .t-usc .card { background: #2a0a0d; border-color: #451519; }
  .t-usc .row + .row { border-color: #451519; }
  .t-usc .abbr { background: #4d171c; }
  .t-usc .name { color: #e2c7c0; }
  .t-usc .lose .score, .t-usc .lose .abbr { color: #8c6a66; }
  .t-usc .status { background: #1c0507; color: #e2c7c0; }
  .t-usc .lines { border-color: #451519; color: #f0dcd6; }
  .t-usc .lines .lbl { color: #FFC72C; }
  .t-usc .card.fav { border-color: #FFC72C; }
  .t-usc .card.live { border-color: #ffffff; }
  .t-usc .card.live.fav { border-color: #FFC72C; }
  .t-usc .live .status { background: #990000; color: #ffffff; }
  .t-usc .dot { background: #FFC72C; }
  .t-usc #crawllabel { background: #FFC72C; color: #990000; }
  .t-usc #crawl { color: #ffffff; }
  .t-usc #crawl .st { color: #ffcf9a; }
  .t-usc #crawl .lv { color: #FFC72C; }
  .t-usc #foot { color: #7a4a46; }
</style>
</head>
<body>
<div id="shift">
  <div id="top">
    <div id="tabs"></div>
    <div id="brand">Score<span>board</span></div>
    <div id="clock"></div>
  </div>

  <div id="board">
    <div id="heading"></div>
    <div id="cards"></div>
    <div id="msg">Loading scores&hellip;</div>
  </div>

  <div id="crawlbar">
    <div id="crawl"></div>
    <div id="crawllabel">SCORES</div>
  </div>

  <div id="foot"><span id="updated">Connecting&hellip;</span><span class="r">Data: SportsBlaze &middot; ESPN &middot; Opening lines: DraftKings</span></div>
</div>

<script>
/* =================== CONFIG (edit me) =================== */
var CONFIG = {
  // Leagues to show, in this order.
  //   From SportsBlaze: nfl, nba, mlb, wnba
  //   From ESPN:        ncaaf (college football), ncaab (men's college basketball), nhl
  leagues: ['nfl', 'ncaaf', 'nba', 'mlb', 'wnba'],

  // College football: 'top25' = games with a ranked team, 'fbs' = every FBS game
  cfb: 'top25',

  // Colors: 'auto' = Bears on Sunday-Friday, USC on Saturday.
  // Or force one: 'bears', 'usc', 'classic' (the original navy + gold)
  theme: 'auto',

  // Your teams, per league (team abbreviations). They get a highlighted border and go first.
  // Kept per league so 'CHI' (Bears) doesn't also highlight the Chicago Sky, and 'PHI' (Eagles)
  // doesn't also highlight the 76ers or Phillies.
  favorites: {
    nfl:   ['CHI', 'PHI'],   // Bears, Eagles
    ncaaf: ['USC', 'WIS'],   // USC Trojans, Wisconsin Badgers
    nba:   ['SA', 'CHI'],    // Spurs, Bulls
    mlb:   ['CHW', 'CWS']    // White Sox (both common abbreviations)
  },

  // Leagues that also show games that haven't started yet. The season schedule
  // file is large for MLB, so it's off for MLB by default to go easy on old TVs.
  upcoming: ['nfl', 'nba', 'wnba'],

  refreshLiveSec: 60,    // how often to refresh while any game is live
  refreshIdleSec: 300,   // how often to refresh when nothing is live
  rotateSec: 12,         // seconds each screen of cards stays up
  cardsPerPage: 8,       // 2 rows of 4
  lookbackDays: 7,       // if a league has no games today, show its most recent results
  crawlSpeed: 90         // bottom ticker speed (pixels per second)
};
/* ======================================================== */

var API = 'https://cache.sportsblaze.com';
var ESPN_API = 'https://site.api.espn.com/apis/site/v2/sports/';
var ESPN_PATHS = { ncaaf: 'football/college-football', ncaab: 'basketball/mens-college-basketball', nhl: 'hockey/nhl' };
var LEAGUE_NAMES = { nfl: 'NFL', nba: 'NBA', mlb: 'MLB', wnba: 'WNBA', ncaaf: 'NCAAF', ncaab: 'NCAAB', nhl: 'NHL' };
var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

var state = { data: {}, pages: [], pageIndex: 0, lastOk: null, failures: 0, crawlKey: '' };
var cache = { lookback: {}, schedule: {} };
var DEMO = false;

/* ---------- small helpers ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function inList(list, v) { for (var i = 0; i < list.length; i++) { if (list[i] === v) return true; } return false; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function timeStr(d) {
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + pad(m) + ' ' + ap;
}
function parseDate(s) {
  var d = new Date(s);
  if (isNaN(d.getTime()) && s) {           // very old browsers: parse ISO by hand
    var p = String(s).match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
    if (p) d = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3], +p[4], +p[5]));
  }
  return d;
}
function ordinal(n) {
  var s = ['TH', 'ST', 'ND', 'RD'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function seasonYear(lg, now) {
  var y = now.getFullYear(), m = now.getMonth() + 1;
  if (lg === 'nba') return m >= 8 ? y : y - 1;   // 2026-27 NBA season = 2026
  if (lg === 'nfl') return m >= 3 ? y : y - 1;   // Jan/Feb playoffs belong to last year's season
  return y;
}

function readParams() {
  var q = window.location.search.replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split('='), k = kv[0], v = decodeURIComponent(kv[1] || '');
    if (!k) continue;
    if (k === 'leagues' && v) CONFIG.leagues = v.toLowerCase().split(',');
    if (k === 'fav') CONFIG.favorites = v ? v.toUpperCase().split(',') : [];
    if (k === 'upcoming') CONFIG.upcoming = v ? v.toLowerCase().split(',') : [];
    if (k === 'rotate' && +v > 2) CONFIG.rotateSec = +v;
    if (k === 'cfb' && v) CONFIG.cfb = v.toLowerCase();
    if (k === 'theme' && v) CONFIG.theme = v.toLowerCase();
    if (k === 'demo' && v !== '0') DEMO = true;
  }
}

/* ---------- networking (XMLHttpRequest works everywhere) ---------- */
function getJSON(url, cb) {
  var done = false;
  function finish(err, data) { if (!done) { done = true; cb(err, data); } }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    try { x.timeout = 20000; } catch (t) {}
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var data = null;
        try { data = JSON.parse(x.responseText); } catch (e) { return finish('bad data'); }
        finish(null, data);
      } else {
        finish('HTTP ' + x.status);
      }
    };
    x.ontimeout = function () { finish('timeout'); };
    x.onerror = function () { finish('network'); };
    x.send();
  } catch (e) { finish('network'); }
}

/* One day of games for any league, whichever feed it comes from. */
function dayGames(lg, dateStr, cb) {
  if (DEMO) return cb(null, demoEvents(lg, dateStr));
  if (ESPN_PATHS[lg]) return espnDay(lg, dateStr, cb);
  boxscores(lg, dateStr, cb);
}

/* ---- ESPN feed (college football etc.), converted to the same shape as SportsBlaze ---- */
function espnDay(lg, dateStr, cb) {
  var url = ESPN_API + ESPN_PATHS[lg] + '/scoreboard?dates=' + dateStr.replace(/-/g, '');
  if (lg === 'ncaaf' && CONFIG.cfb === 'fbs') url += '&groups=80&limit=200';
  if (lg === 'ncaab') url += '&groups=50&limit=200';
  getJSON(url, function (err, data) {
    if (err) return cb(err);
    var evs = (data && data.events) || [], out = [];
    for (var i = 0; i < evs.length; i++) { var g = fromEspn(evs[i]); if (g) out.push(g); }
    cb(null, out);
  });
}
function fromEspn(ev) {
  var c = (ev.competitions && ev.competitions[0]) || {}, st = ev.status || c.status || {}, ty = st.type || {};
  var teams = {}, total = { away: '', home: '' }, comps = c.competitors || [];
  for (var i = 0; i < comps.length; i++) {
    var cp = comps[i], t = cp.team || {}, side = cp.homeAway === 'home' ? 'home' : 'away';
    var rk = cp.curatedRank && cp.curatedRank.current;
    teams[side] = { abbreviation: t.abbreviation || '', name: t.displayName || '',
                    short: t.shortDisplayName || t.location || '', rank: rk && rk <= 25 ? rk : 0 };
    total[side] = cp.score != null ? cp.score : '';
  }
  if (!teams.away || !teams.home) return null;
  recordLine(ev, c);
  var desc = ty.description || '', state = ty.state;
  var live = state === 'in';
  var fin = state === 'post' && !/postpon|cancel|suspend|delay/i.test(desc);
  return {
    id: 'espn' + ev.id, teams: teams, date: ev.date, live: live,
    status: live ? (desc || 'In Progress') : (fin ? 'Final' : (desc || 'Scheduled')),
    detail: ty.shortDetail || '', espn: true,
    scores: (live || fin) ? { total: total } : null
  };
}

/* ---- Opening spread & over/under (DraftKings, via ESPN) ----
   ESPN can drop the lines once a game starts, so each opening line is saved the first
   time it's seen (in memory + the browser's storage) and kept until the game is old. */
var ESPN_ODDS_PATHS = { nfl: 'football/nfl', nba: 'basketball/nba', mlb: 'baseball/mlb', wnba: 'basketball/wnba' };
var LINES_KEY = 'tickerOpenLines';
var lines = (function () {
  try { return JSON.parse(window.localStorage.getItem(LINES_KEY)) || {}; } catch (e) { return {}; }
})();
function saveLines() {
  if (DEMO) return;                                // never store fake demo lines
  try {
    var cut = ymd(addDays(new Date(), -10));
    for (var k in lines) if (lines.hasOwnProperty(k) && k.substr(0, 10) < cut) delete lines[k];
    window.localStorage.setItem(LINES_KEY, JSON.stringify(lines));
  } catch (e) {}
}
function gameKey(dateStr, awayName, homeName) {
  return ymd(parseDate(dateStr)) + '|' + nickname(awayName).toLowerCase() + '@' + nickname(homeName).toLowerCase();
}
function keyOf(e) { return gameKey(e.date, e.teams.away.name, e.teams.home.name); }
function recordLine(ev, c) {
  var o = c && c.odds && c.odds[0];
  if (!o) return;
  var comps = c.competitors || [], names = {};
  for (var i = 0; i < comps.length; i++) {
    names[comps[i].homeAway === 'home' ? 'home' : 'away'] = (comps[i].team || {}).displayName;
  }
  if (!names.away || !names.home) return;
  var key = gameKey(ev.date, names.away, names.home);
  if (lines[key]) return;                          // opening line never changes: keep the first one
  var ps = o.pointSpread || {};
  var hl = ps.home && ps.home.open && ps.home.open.line, al = ps.away && ps.away.open && ps.away.open.line;
  var tl = o.total && o.total.over && o.total.over.open && o.total.over.open.line;
  var rec = {};
  if (hl || al) {
    if (/^-/.test(hl)) { rec.side = 'home'; rec.line = hl; }
    else if (/^-/.test(al)) { rec.side = 'away'; rec.line = al; }
    else rec.line = 'PK';
  }
  if (tl) rec.total = String(tl).replace(/^[ou]\s*/i, '');
  if (rec.line || rec.total) lines[key] = rec;
}
/* Pro leagues get scores from SportsBlaze, so look up their lines on ESPN by date + team. */
function fetchLines(lg, games, cb) {
  if (DEMO) { demoLines(games); return cb(); }
  var path = ESPN_ODDS_PATHS[lg];
  if (!path) return cb();                          // ESPN leagues already recorded theirs
  cache.linesAt = cache.linesAt || {};
  var now = new Date().getTime(), seen = {}, list = [], i;
  for (i = 0; i < games.length; i++) {
    if (lines[keyOf(games[i])]) continue;
    var d = ymd(parseDate(games[i].date));
    if (!seen[d]) { seen[d] = true; list.push(d); }
  }
  list = list.slice(0, 8);
  var n = 0;
  function step() {
    if (n >= list.length) return cb();
    var d = list[n++], ck = lg + d;
    if (cache.linesAt[ck] && now - cache.linesAt[ck] < 30 * 60000) return step();
    getJSON(ESPN_API + path + '/scoreboard?dates=' + d.replace(/-/g, ''), function (err, data) {
      cache.linesAt[ck] = now;
      var evs = (!err && data && data.events) || [];
      for (var j = 0; j < evs.length; j++) recordLine(evs[j], evs[j].competitions && evs[j].competitions[0]);
      step();
    });
  }
  step();
}

function boxscores(lg, dateStr, cb) {
  getJSON(API + '/boxscores/' + lg + '/' + dateStr, function (err, data) {
    if (err) return cb(err);
    var evs = (data && data.events) || [];
    for (var i = 0; i < evs.length; i++) { evs[i].players = null; evs[i].statistics = null; } // free memory
    cb(null, evs);
  });
}

/* Season schedule: only used to find games that haven't started yet. Cached 30 min. */
function upcomingGames(lg, now, cb) {
  if (!inList(CONFIG.upcoming, lg) || DEMO) return cb([]);
  var c = cache.schedule[lg];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  getJSON(API + '/schedule/' + lg + '/' + seasonYear(lg, now), function (err, data) {
    if (err) return cb(c ? c.events : []);
    var all = (data && data.events) || [], keep = [];
    var from = now.getTime() - 6 * 3600000, to = addDays(now, 8).getTime();
    for (var i = 0; i < all.length; i++) {
      var e = all[i], t = parseDate(e.date).getTime();
      if (t >= from && t <= to && !e.live && !/final/i.test(e.status || '')) {
        keep.push({ id: e.id, teams: e.teams, date: e.date, live: false, status: e.status, season: e.season });
      }
    }
    all = null; data = null;
    cache.schedule[lg] = { at: now.getTime(), events: keep };
    cb(keep);
  });
}

/* If a league has nothing today, walk back day by day to the latest results. Cached 30 min. */
function latestResults(lg, now, cb) {
  var c = cache.lookback[lg];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  var n = 1;
  function step() {
    if (n > CONFIG.lookbackDays) { cache.lookback[lg] = { at: now.getTime(), events: [] }; return cb([]); }
    dayGames(lg, ymd(addDays(now, -n)), function (err, evs) {
      if (!err && evs.length) { cache.lookback[lg] = { at: now.getTime(), events: evs }; return cb(evs); }
      n++; step();
    });
  }
  step();
}

/* ESPN leagues: if nothing today, look ahead day by day to the next game day. Cached 30 min. */
function nextGameDay(lg, now, cb) {
  if (!ESPN_PATHS[lg] && !DEMO) return cb([]);
  var key = 'next_' + lg, c = cache.lookback[key];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  var n = 1;
  function step() {
    if (n > 6) { cache.lookback[key] = { at: now.getTime(), events: [] }; return cb([]); }
    dayGames(lg, ymd(addDays(now, n)), function (err, evs) {
      if (!err && evs.length) { cache.lookback[key] = { at: now.getTime(), events: evs }; return cb(evs); }
      n++; step();
    });
  }
  step();
}

/* College football: every game from tomorrow through Saturday, so the week's slate is
   always on screen. Cached 30 min so it adds only a few requests per half hour. */
function weekAhead(lg, now, cb) {
  if (lg !== 'ncaaf') return cb([]);
  var key = 'week_' + lg, c = cache.lookback[key];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  var days = 6 - now.getDay(), n = 1, all = [];   // Sun..Fri -> through Saturday; Sat -> none
  function step() {
    if (n > days) { cache.lookback[key] = { at: now.getTime(), events: all }; return cb(all); }
    dayGames(lg, ymd(addDays(now, n)), function (err, evs) {
      if (!err) all = all.concat(evs);
      n++; step();
    });
  }
  step();
}
function addNew(list, more) {
  var ids = {}, i, out = list.slice(0);
  for (i = 0; i < list.length; i++) ids[list[i].id] = true;
  for (i = 0; i < more.length; i++) if (!ids[more[i].id]) { ids[more[i].id] = true; out.push(more[i]); }
  return out;
}

function loadLeague(lg, cb) {
  var now = new Date(), today = ymd(now);
  dayGames(lg, today, function (err, todays) {
    if (err) return cb(err);
    var got = todays.slice(0);
    // just after midnight, late west-coast games are still filed under yesterday
    var extra = function (next) {
      if (now.getHours() >= 5) return next();
      dayGames(lg, ymd(addDays(now, -1)), function (e2, y) {
        if (!e2) for (var i = 0; i < y.length; i++) if (y[i].live) got.push(y[i]);
        next();
      });
    };
    extra(function () {
      upcomingGames(lg, now, function (up) {
        var ids = {}, i, games = got.slice(0);
        for (i = 0; i < got.length; i++) ids[got[i].id] = true;
        var hasToday = got.length > 0, upToday = [], upLater = [];
        for (i = 0; i < up.length; i++) {
          if (ids[up[i].id]) continue;
          if (ymd(parseDate(up[i].date)) === today) upToday.push(up[i]); else upLater.push(up[i]);
        }
        games = games.concat(upToday);
        if (hasToday || upToday.length) {
          return weekAhead(lg, now, function (ahead) {
            cb(null, { games: addNew(games, ahead), label: ahead.length ? 'Today & this week' : 'Today' });
          });
        }
        latestResults(lg, now, function (recent) {
          var findNext = lg === 'ncaaf' ? weekAhead : nextGameDay;
          findNext(lg, now, function (nextDay) {
            var later = addNew(upLater, nextDay).slice(0, lg === 'ncaaf' ? 60 : 16);
            var label = recent.length && later.length ? 'Recent & upcoming' :
                        (recent.length ? 'Latest results' : (later.length ? 'Coming up' : ''));
            cb(null, { games: recent.concat(later), label: label });
          });
        });
      });
    });
  });
}

/* ---------- presentation ---------- */
function isFinal(e) { return /final/i.test(e.status || ''); }
function periodCount(e) {
  var n = 0, p = e.scores && e.scores.periods;
  if (p) for (var k in p) if (p.hasOwnProperty(k)) n++;
  return n;
}
function statusText(e, lg) {
  var st = e.status || '', d = parseDate(e.date), today = ymd(new Date());
  var dayTag = ymd(d) === today ? '' : DAYS[d.getDay()] + ' ';
  if (e.espn) {                                   // ESPN already writes a good status line
    if (e.live) return (e.detail || 'LIVE').toUpperCase();
    if (isFinal(e)) return (e.detail || 'FINAL').toUpperCase() + (dayTag ? ' · ' + DAYS[d.getDay()] : '');
    if (/postpon|cancel|delay|suspend/i.test(st)) return st.toUpperCase();
    if (/TBD/i.test(e.detail)) {                  // kickoff time not set yet
      var p2 = String(e.date).match(/(\d+)-(\d+)-(\d+)/), dd = p2 ? new Date(+p2[1], +p2[2] - 1, +p2[3]) : d;
      return (ymd(dd) === today ? '' : DAYS[dd.getDay()] + ' ') + 'TBD';
    }
    return dayTag + timeStr(d);
  }
  if (e.live) {
    if (st && !/in progress/i.test(st)) return st.toUpperCase();
    var p = +e.period || 0, out = '';
    if (lg === 'mlb') {
      var half = e.half || e.inning_half || e.inningHalf || '';
      out = (half ? String(half).substr(0, 3).toUpperCase() + ' ' : '') + (p ? ordinal(p) : 'LIVE');
    } else if (p) {
      out = p <= 4 ? 'Q' + p : (p === 5 ? 'OT' : (p - 4) + 'OT');
    } else out = 'LIVE';
    if (e.clock) out += '  ' + e.clock;
    return out;
  }
  if (isFinal(e)) {
    var n = periodCount(e), tag = 'FINAL';
    if (lg === 'mlb' && n > 9) tag = 'FINAL/' + n;
    else if (lg !== 'mlb' && n > 4) tag = n === 5 ? 'FINAL/OT' : 'FINAL/' + (n - 4) + 'OT';
    return tag + (dayTag ? ' · ' + DAYS[d.getDay()] : '');
  }
  if (/postpon|cancel|delay|suspend/i.test(st)) return st.toUpperCase();
  return dayTag + timeStr(d);
}
function scoreOf(e, side) {
  var t = e.scores && e.scores.total;
  return t && t[side] != null ? t[side] : '';
}
function favList(lg) {
  var f = CONFIG.favorites;
  if (f && f.length !== undefined) return f;      // ?fav=... in the address applies to every league
  return (f && f[lg]) || [];
}
function isFav(e, lg) {
  var a = e.teams && e.teams.away, h = e.teams && e.teams.home, list = favList(lg);
  return (a && inList(list, a.abbreviation)) || (h && inList(list, h.abbreviation));
}
function rank(e) { return e.live ? 0 : (isFinal(e) ? 2 : 1); }
function sortGames(list, lg) {
  return list.sort(function (a, b) {
    var fa = isFav(a, lg) ? 0 : 1, fb = isFav(b, lg) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    var ta = parseDate(a.date).getTime(), tb = parseDate(b.date).getTime();
    return rank(a) === 2 ? tb - ta : ta - tb;      // newest finals first, soonest upcoming first
  });
}

/* "San Antonio Spurs" -> "Spurs", "Boston Red Sox" -> "Red Sox" */
function nickname(name) {
  var w = String(name || '').split(' ');
  if (w.length > 2 && /^(Sox|Jays|Blazers)$/.test(w[w.length - 1])) return w[w.length - 2] + ' ' + w[w.length - 1];
  return w[w.length - 1];
}

/* "MIA -3.5" style spread text, using the card's own team abbreviation */
function spreadText(e) {
  var o = e.open;
  if (!o || !o.line) return '';
  if (o.line === 'PK') return 'PK';
  var t = e.teams[o.side];
  return (t ? t.abbreviation + ' ' : '') + o.line;
}
function lineHTML(e) {
  var o = e.open, sp = spreadText(e);
  if (!o) return '<div class="lines">&nbsp;</div>';
  return '<div class="lines">' + (o.total ? '<span class="ou">O/U ' + esc(o.total) + '</span>' : '') +
    '<span class="lbl">OPEN</span>' + (sp ? esc(sp) : '') + '</div>';
}

function cardHTML(e, lg) {
  var a = e.teams.away, h = e.teams.home, sa = scoreOf(e, 'away'), sh = scoreOf(e, 'home');
  var fin = isFinal(e), loseA = fin && +sa < +sh, loseH = fin && +sh < +sa;
  var cls = 'card' + (e.live ? ' live' : '') + (isFav(e, lg) ? ' fav' : '');
  function row(t, s, lose) {
    return '<div class="row' + (lose ? ' lose' : '') + '"><span class="abbr">' + esc(t.abbreviation) +
      '</span><span class="name">' + (t.rank ? '<b class="rk">' + t.rank + '</b>' : '') +
      esc(t.short || nickname(t.name)) + '</span><span class="score">' + esc(s) + '</span></div>';
  }
  return '<div class="' + cls + '">' + row(a, sa, loseA) + row(h, sh, loseH) +
    lineHTML(e) +
    '<div class="status">' + (e.live ? '<span class="dot"></span>' : '') + esc(statusText(e, lg)) + '</div></div>';
}

function buildPages() {
  var pages = [];
  for (var i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i], d = state.data[lg];
    if (!d || !d.games.length) continue;
    var games = sortGames(d.games.slice(0), lg), per = CONFIG.cardsPerPage;
    // Favorite teams' games are pinned: they appear on every screen of their league,
    // and the other games rotate through the remaining spots.
    var pinned = [], others = [];
    for (var g = 0; g < games.length; g++) {
      if (isFav(games[g], lg) && pinned.length < per - 2) pinned.push(games[g]); else others.push(games[g]);
    }
    var slots = per - pinned.length;
    var total = Math.max(1, Math.ceil(others.length / slots));
    for (var p = 0; p < total; p++) {
      pages.push({ lg: lg, label: d.label, games: pinned.concat(others.slice(p * slots, (p + 1) * slots)),
                   num: p + 1, of: total });
    }
  }
  state.pages = pages;
  if (state.pageIndex >= pages.length) state.pageIndex = 0;
}

function renderTabs(activeLg) {
  var html = '';
  for (var i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i], d = state.data[lg];
    var cls = 'tab' + (lg === activeLg ? ' on' : '') + (!d || !d.games.length ? ' empty' : '');
    html += '<span class="' + cls + '">' + (LEAGUE_NAMES[lg] || lg.toUpperCase()) + '</span>';
  }
  $('tabs').innerHTML = html;
}

function renderPage() {
  var pg = state.pages[state.pageIndex];
  if (!pg) {
    renderTabs('');
    $('heading').innerHTML = ''; $('cards').innerHTML = '';
    var m = $('msg'); m.style.display = 'block';
    if (state.lastOk) m.innerHTML = 'No games right now<small>Scores will appear here automatically when games start.</small>';
    return;
  }
  $('msg').style.display = 'none';
  renderTabs(pg.lg);
  var live = 0;
  for (var i = 0; i < pg.games.length; i++) if (pg.games[i].live) live++;
  var sub = pg.label + (live ? ' · ' + live + ' live' : '');
  $('heading').innerHTML = '<span class="lg">' + (LEAGUE_NAMES[pg.lg] || pg.lg.toUpperCase()) + '</span>' +
    '<span class="sub">' + esc(sub) + '</span>' +
    (pg.of > 1 ? '<span class="page">' + pg.num + ' / ' + pg.of + '</span>' : '');
  var html = '';
  for (var j = 0; j < pg.games.length; j++) html += cardHTML(pg.games[j], pg.lg);
  $('cards').innerHTML = html;
}

function renderCrawl() {
  var html = '', key = '';
  for (var i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i], d = state.data[lg];
    if (!d || !d.games.length) continue;
    var games = sortGames(d.games.slice(0), lg);
    html += '<span class="lg">' + (LEAGUE_NAMES[lg] || lg.toUpperCase()) + '</span>';
    for (var j = 0; j < games.length; j++) {
      var e = games[j], a = e.teams.away, h = e.teams.home, sa = scoreOf(e, 'away'), sh = scoreOf(e, 'home');
      var st = statusText(e, lg);
      var body = sa !== '' ? esc(a.abbreviation) + ' ' + esc(sa) + '  ' + esc(h.abbreviation) + ' ' + esc(sh)
                           : esc(a.abbreviation) + ' @ ' + esc(h.abbreviation);
      var ln = '';
      if (e.open && !e.live && !isFinal(e)) {      // lines in the crawl for games not started yet
        ln = spreadText(e) + (e.open.total ? (spreadText(e) ? '  ' : '') + 'O/U ' + e.open.total : '');
      }
      html += '<span class="g">' + body + '<span class="st' + (e.live ? ' lv' : '') + '">' + esc(st) + '</span>' +
              (ln ? '<span class="st">  ' + esc(ln) + '</span>' : '') + '</span>';
      key += body + st + ln;
    }
  }
  if (key === state.crawlKey) return;           // unchanged: don't restart the scroll
  state.crawlKey = key;
  var el = $('crawl');
  if (!html) { el.innerHTML = ''; el.style.webkitAnimation = el.style.animation = 'none'; return; }
  el.innerHTML = html + html;                   // doubled for a seamless loop
  var w = el.offsetWidth / 2, secs = Math.max(20, Math.round(w / CONFIG.crawlSpeed));
  var anim = 'crawl ' + secs + 's linear infinite';
  el.style.webkitAnimation = 'none'; el.style.animation = 'none';
  void el.offsetWidth;                          // restart animation
  el.style.webkitAnimation = anim; el.style.animation = anim;
}

/* Saturday = USC, every other day = Bears (unless a theme is forced) */
function applyTheme(d) {
  var t = CONFIG.theme;
  if (t === 'auto') t = d.getDay() === 6 ? 'usc' : 'bears';
  var cls = t === 'classic' ? '' : 't-' + t;
  if (document.body.className !== cls) document.body.className = cls;
}

function renderClock() {
  var d = new Date();
  applyTheme(d);
  $('clock').innerHTML = '<small>' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + '</small>' + timeStr(d);
}

function renderFoot(errs) {
  var t = state.lastOk ? 'Updated ' + timeStr(state.lastOk) : 'Connecting…';
  if (errs) t += '  ·  ' + errs + ' league(s) failed to load, retrying';
  $('updated').innerHTML = esc(t) + (DEMO ? '  ·  DEMO DATA' : '');
}

/* ---------- main loop ---------- */
function refreshAll() {
  var i = 0, errs = 0, anyLive = false;
  function next() {
    if (i >= CONFIG.leagues.length) return finished();
    var lg = CONFIG.leagues[i++];
    loadLeague(lg, function (err, res) {
      if (err) { errs++; return next(); }        // keep the last good data on screen
      fetchLines(lg, res.games, function () {
        for (var k = 0; k < res.games.length; k++) {
          res.games[k].open = lines[keyOf(res.games[k])] || null;
          if (res.games[k].live) anyLive = true;
        }
        state.data[lg] = res;
        next();
      });
    });
  }
  function finished() {
    saveLines();
    if (errs < CONFIG.leagues.length) { state.lastOk = new Date(); state.failures = 0; }
    else state.failures++;
    if (!state.lastOk && state.failures) {
      var m = $('msg'); m.style.display = 'block';
      m.innerHTML = 'Can&rsquo;t reach SportsBlaze<small>Check that this screen is connected to the internet. ' +
        'Retrying automatically&hellip;</small>';
    }
    buildPages(); renderPage(); renderCrawl(); renderFoot(errs);
    var wait = state.failures ? 30 : (anyLive ? CONFIG.refreshLiveSec : CONFIG.refreshIdleSec);
    setTimeout(refreshAll, wait * 1000);
  }
  next();
}

function rotate() {
  if (state.pages.length > 1) { state.pageIndex = (state.pageIndex + 1) % state.pages.length; renderPage(); }
  setTimeout(rotate, CONFIG.rotateSec * 1000);
}

/* nudge everything a few pixels every 10 min to protect older screens from burn-in */
function antiBurn() {
  var s = $('shift');
  s.style.top = Math.round(Math.random() * 4 - 2) + 'px';
  s.style.left = Math.round(Math.random() * 4 - 2) + 'px';
}

/* ---------- demo data (?demo=1) ---------- */
function demoLines(games) {
  for (var i = 0; i < games.length; i++) {
    if (i % 4 === 3) continue;                     // leave some games without a line
    var k = keyOf(games[i]);
    if (!lines[k]) lines[k] = { side: i % 2 ? 'home' : 'away', line: '-' + (1.5 + i * 2), total: '' + (44.5 + i * 3) };
  }
}
function demoEvents(lg, dateStr) {
  var today = ymd(new Date());
  if (lg === 'ncaaf') {
    var sat = addDays(new Date(), 6 - new Date().getDay());
    if (dateStr === ymd(sat) && dateStr !== today) {
      var k1 = new Date(sat.getTime()); k1.setHours(11, 0, 0, 0);
      return [{ id: 'cf9', espn: true, teams: { away: { abbreviation: 'PITT', name: 'Pittsburgh', short: 'Pittsburgh', rank: 0 },
        home: { abbreviation: 'MIA', name: 'Miami', short: 'Miami', rank: 1 } }, date: k1.toISOString(),
        live: false, status: 'Scheduled', detail: '' }];
    }
    if (dateStr !== today) return [];
    var at = new Date(); at.setHours(19, 0, 0, 0);
    function tm(ab, short, rank) { return { abbreviation: ab, name: short, short: short, rank: rank }; }
    return [
      { id: 'cf1', espn: true, teams: { away: tm('OSU', 'Ohio State', 4), home: tm('IU', 'Indiana', 5) }, date: at.toISOString(),
        live: true, status: 'In Progress', detail: '8:32 - 3rd', scores: { total: { away: 17, home: 14 } } },
      { id: 'cf2', espn: true, teams: { away: tm('FLA', 'Florida', 0), home: tm('TEX', 'Texas', 7) }, date: at.toISOString(),
        live: false, status: 'Final', detail: 'Final/OT', scores: { total: { away: 27, home: 30 } } },
      { id: 'cf3', espn: true, teams: { away: tm('NEB', 'Nebraska', 0), home: tm('ORE', 'Oregon', 13) },
        date: new Date(at.getTime() + 3 * 3600000).toISOString(), live: false, status: 'Scheduled', detail: '' }
    ];
  }
  var T = {
    nba: [['ATL', 'Atlanta Hawks'], ['ORL', 'Orlando Magic'], ['MIL', 'Milwaukee Bucks'], ['WAS', 'Washington Wizards'],
          ['SA', 'San Antonio Spurs'], ['DAL', 'Dallas Mavericks'], ['NY', 'New York Knicks'], ['BOS', 'Boston Celtics'],
          ['LAL', 'Los Angeles Lakers'], ['GS', 'Golden State Warriors'], ['DEN', 'Denver Nuggets'], ['PHX', 'Phoenix Suns']],
    nfl: [['HOU', 'Houston Texans'], ['JAX', 'Jacksonville Jaguars'], ['DAL', 'Dallas Cowboys'], ['GB', 'Green Bay Packers'],
          ['KC', 'Kansas City Chiefs'], ['LAC', 'Los Angeles Chargers']],
    mlb: [['LAD', 'Los Angeles Dodgers'], ['NYY', 'New York Yankees']]
  }[lg];
  if (!T) return [];
  if (lg === 'nfl' && dateStr === today) return [];
  if (lg === 'nfl' && dateStr !== ymd(addDays(new Date(), -3))) return [];
  if (lg === 'mlb' && dateStr !== today) return [];
  if (lg === 'nba' && dateStr !== today) return [];
  var out = [], base = new Date(); base.setHours(18, 30, 0, 0);
  for (var i = 0; i + 1 < T.length; i += 2) {
    var k = i / 2, live = lg !== 'nfl' && k % 3 !== 2, fin = lg === 'nfl' || k % 3 === 2;
    if (lg === 'nba' && k >= 4) { live = false; fin = false; }
    var ev = {
      id: lg + k, teams: { away: { abbreviation: T[i][0], name: T[i][1] }, home: { abbreviation: T[i + 1][0], name: T[i + 1][1] } },
      date: new Date(base.getTime() + k * 1800000).toISOString(), live: live,
      status: live ? 'In Progress' : (fin ? 'Final' : 'Scheduled')
    };
    if (live || fin) {
      ev.scores = { total: { away: 80 + k * 13 % 40, home: 75 + k * 17 % 45 }, periods: { 1: {}, 2: {}, 3: {}, 4: {} } };
      if (lg === 'nfl') ev.scores.total = { away: 17 + k * 7, home: 20 + k * 3 };
      if (lg === 'mlb') { ev.scores.total = { away: 3, home: 5 }; ev.period = 7; ev.half = 'Top'; }
      if (lg === 'nba' && live) { ev.period = 3 + (k % 2); ev.clock = (k + 2) + ':' + pad(k * 11 % 60); }
    }
    if (lg === 'nba' && k === 4) ev.date = new Date(base.getTime() + 3 * 3600000).toISOString();
    out.push(ev);
  }
  return out;
}

/* ---------- start ---------- */
readParams();
renderClock(); setInterval(renderClock, 10000);
$('msg').style.display = 'block';
refreshAll();
setTimeout(rotate, CONFIG.rotateSec * 1000);
setInterval(antiBurn, 10 * 60000);
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
</script>
</body>
