<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap">
<!--
  SPORTS TICKER  -  powered by SportsBlaze (free, no API key)
  -------------------------------------------------------------
  Written in old-style JavaScript (no fetch, no arrow functions)
  so it runs on older Samsung TV / monitor web browsers.

  QUICK SETTINGS: edit the CONFIG block below, OR add options to
  the page address, for example:
     index.html?leagues=nfl,nba&fav=DAL,SA
     index.html?demo=1           (fake games, to test the layout)
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #05070d;
    color: #f2f4f8;
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shift { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  /* ---------- header ---------- */
  #top {
    position: absolute; top: 0; left: 0; right: 0;
    height: 9vh;
    background: #0b1020;
    border-bottom: 0.35vh solid #f5b800;
  }
  #brand {
    position: absolute; left: 2.5vw; top: 0; line-height: 9vh;
    font-size: 4.2vh; font-weight: 700; letter-spacing: 0.15vw;
    text-transform: uppercase;
  }
  #brand span { color: #f5b800; }
  #tabs { position: absolute; left: 0; right: 0; top: 0; text-align: center; line-height: 9vh; }
  .tab {
    display: inline-block; vertical-align: middle;
    margin: 0 0.2vw; padding: 0 0.8vw;
    height: 5vh; line-height: 5vh;
    font-size: 3vh; font-weight: 600; letter-spacing: 0.08vw;
    color: #6f7a94; border-radius: 0.6vh;
  }
  .tab.on { background: #f5b800; color: #05070d; }
  .tab.empty { color: #2e3548; }
  #clock {
    position: absolute; right: 2.5vw; top: 0; line-height: 9vh; text-align: right;
    font-size: 4.6vh; font-weight: 600;
  }
  #clock small { font-size: 2.6vh; color: #8892aa; margin-right: 1vw; font-weight: 500; }

  /* ---------- main board ---------- */
  #board { position: absolute; top: 9vh; left: 0; right: 0; bottom: 13vh; padding: 1.6vh 1.6vw 0 1.6vw; }
  #heading { height: 6vh; line-height: 6vh; padding: 0 0.6vw; }
  #heading .lg { font-size: 5vh; font-weight: 700; letter-spacing: 0.2vw; }
  #heading .sub { font-size: 3vh; color: #8892aa; margin-left: 1.2vw; font-weight: 500; }
  #heading .page { float: right; font-size: 2.6vh; color: #6f7a94; }
  #cards { margin-top: 1vh; }

  .card {
    display: inline-block; vertical-align: top;
    width: 30.2vw; margin: 0 0.6vw 1.8vh 0.6vw;
    background: #111829; border-radius: 1vh; overflow: hidden;
    border: 0.3vh solid #1b2338;
  }
  .card.fav { border-color: #f5b800; }
  .card.live { border-color: #e23d3d; }
  .card.live.fav { border-color: #f5b800; }
  .row { position: relative; height: 10vh; line-height: 10vh; padding: 0 1.2vw; }
  .row + .row { border-top: 0.2vh solid #1b2338; }
  .abbr {
    display: inline-block; vertical-align: middle;
    min-width: 6vw; height: 6.6vh; line-height: 6.6vh; text-align: center;
    background: #1f2a44; border-radius: 0.7vh;
    font-size: 4.6vh; font-weight: 700; letter-spacing: 0.05vw;
  }
  /* team logo on a light disc, so dark logos still show on the dark cards */
  .logo {
    display: inline-block; vertical-align: middle; position: relative;
    width: 7vh; height: 7vh; margin-right: 0.7vw;
    border-radius: 50%; background: #f2f4f8; overflow: hidden;
  }
  .logo img { position: absolute; left: 0.75vh; top: 0.75vh; width: 5.5vh; height: 5.5vh; }
  .logo.none { background: transparent; }
  .lose .logo { opacity: 0.55; }
  .stripe { height: 0.9vh; }
  /* squarer screens (4:3, 5:4): drop the small team names so letters + scores have room */
  .narrow .name { display: none; }
  .narrow .abbr { min-width: 7vw; }
  .narrow .lines { font-size: 2.5vh; }
  .narrow .lines .lbl { font-size: 1.9vh; margin-right: 0.7vw; }              /* home team color across the top of the card */
  .name {
    display: inline-block; vertical-align: middle;
    max-width: 8.6vw; margin-left: 0.8vw;
    font-size: 3.1vh; color: #a5aec4; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 3.8vh;
  }
  .rk { color: #f5b800; font-weight: 700; margin-right: 0.4vw; }
  .score { position: absolute; right: 1.2vw; top: 0; font-size: 7.6vh; font-weight: 700; }
  .lose .score, .lose .abbr { color: #6f7a94; }
  .status {
    height: 5.6vh; line-height: 5.6vh; padding: 0 1.2vw;
    background: #0b1020; font-size: 3.5vh; font-weight: 600; letter-spacing: 0.1vw;
    color: #a5aec4; text-transform: uppercase;
  }
  .live .status { background: #3a0f14; color: #ffd5d5; }
  .lines {
    height: 4.6vh; line-height: 4.6vh; padding: 0 1.2vw;
    border-top: 0.2vh solid #1b2338; white-space: nowrap; overflow: hidden;
    font-size: 3.1vh; font-weight: 600; color: #c9d0e0;
  }
  .lines .lbl { color: #f5b800; font-size: 2.5vh; letter-spacing: 0.15vw; margin-right: 0.9vw; }
  .lines .ou { float: right; }
  .fight .abbr { font-size: 3.4vh; max-width: 20vw; padding: 0 0.6vw; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }
  .fight .name { display: none; }
  .fight .abbr { max-width: 24vw; }
  .fight .score { color: #f5b800; }
  .t-bears .fight .score { color: #E65C1E; }
  .t-usc .fight .score { color: #FFC72C; }
  .dot {
    display: inline-block; width: 1.7vh; height: 1.7vh; border-radius: 50%;
    background: #ff4545; margin-right: 0.7vw; vertical-align: middle; position: relative; top: -0.2vh;
    -webkit-animation: pulse 1.6s infinite; animation: pulse 1.6s infinite;
  }
  @-webkit-keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }

  #msg {
    display: none; position: absolute; top: 34vh; left: 10vw; right: 10vw;
    text-align: center; font-size: 4.4vh; color: #a5aec4; line-height: 6vh;
  }
  #msg small { display: block; font-size: 2.8vh; color: #6f7a94; margin-top: 1.5vh; line-height: 4vh; }

  /* ---------- bottom crawl ---------- */
  #crawlbar {
    position: absolute; left: 0; right: 0; bottom: 4vh; height: 9vh;
    background: #0b1020; border-top: 0.35vh solid #f5b800; overflow: hidden;
  }
  #crawllabel {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
    background: #f5b800; color: #05070d; padding: 0 1.6vw;
    line-height: 9vh; font-size: 3.6vh; font-weight: 700; letter-spacing: 0.15vw;
  }
  #crawl {
    position: absolute; top: 0; left: 0; white-space: nowrap;
    line-height: 9vh; font-size: 3.8vh; font-weight: 600;
  }
  #crawl .lg { color: #f5b800; margin: 0 1.2vw 0 3vw; font-weight: 700; }
  #crawl .g { margin-right: 2.6vw; }
  #crawl .st { color: #8892aa; margin-left: 0.6vw; font-weight: 500; }
  #crawl .lv { color: #ff6b6b; }
  #crawl .sx { color: #c9d0e0; font-size: 3.1vh; font-weight: 500; margin-left: 1.2vw; }
  #crawl .hl {
    display: inline-block; background: #f5b800; color: #05070d; font-weight: 700;
    padding: 0 1vw; margin: 0 1.6vw 0 3vw; line-height: 5.4vh; border-radius: 0.5vh; font-size: 3.2vh;
  }
  #crawl .n { margin-right: 3.4vw; font-weight: 500; }
  #crawl .nl { color: #f5b800; font-weight: 700; margin-right: 0.8vw; }
  @-webkit-keyframes crawl { from { -webkit-transform: translateX(0); } to { -webkit-transform: translateX(-50%); } }
  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4vh; line-height: 4vh;
    padding: 0 2.5vw; font-size: 2.2vh; color: #555f78;
  }
  #foot .r { float: right; }

  /* =========== NFL PRIMETIME SCREEN (SNF / MNF / TNF) =========== */
  .tab.pt { border: 0.3vh solid #f5b800; color: #ffffff; }
  .tab.pt.on { background: #f5b800; color: #05070d; }
  .tab.pt i { display: inline-block; width: 1.3vh; height: 1.3vh; border-radius: 50%; background: #ff4545;
              margin-right: 0.5vw; vertical-align: middle; position: relative; top: -0.2vh; }
  .ptv .band { position: relative; height: 21vh; border-radius: 1.2vh; overflow: hidden; background: #111829; border: 0.3vh solid #1b2338; }
  .ptv.is-live .band { border-color: #e23d3d; }
  .ptv .bstripe { position: absolute; top: 0; left: 0; right: 0; height: 1vh; }
  .ptv .side { position: absolute; top: 1vh; bottom: 0; width: 34%; }
  .ptv .side.away { left: 0; }
  .ptv .side.home { right: 0; text-align: right; }
  .ptv .ptlogo { padding-top: 3.2vh; }
  .ptv .away .ptlogo { float: left; margin-left: 1.6vw; }
  .ptv .home .ptlogo { float: right; margin-right: 1.6vw; }
  .ptv .ptlogo .logo { width: 13vh; height: 13vh; margin: 0; }
  .ptv .ptlogo .logo img { left: 1.2vh; top: 1.2vh; width: 10.6vh; height: 10.6vh; }
  .ptv .ptlogo .logo.none { background: #1f2a44; }
  .ptv .txt { padding-top: 3.6vh; }
  .ptv .away .txt { margin-left: 18.5vh; }
  .ptv .home .txt { margin-right: 18.5vh; }
  .ptv .nm { font-size: 6vh; font-weight: 700; letter-spacing: 0.1vw; line-height: 7vh; }
  .ptv .sub { font-size: 2.6vh; color: #a5aec4; line-height: 3.6vh; }
  .ptv .to { display: inline-block; width: 2.2vw; height: 0.8vh; background: #f2f4f8; margin: 0 0.15vw; border-radius: 0.4vh; vertical-align: middle; }
  .ptv .to.used { background: #33405c; }
  .ptv .ball { display: inline-block; width: 2.4vh; height: 1.5vh; border-radius: 50%; background: #8b4a22; border: 0.2vh solid #f2f4f8;
               vertical-align: middle; margin: 0 0.6vw; position: relative; top: -0.3vh; }
  .ptv .center { position: absolute; left: 34%; right: 34%; top: 1vh; bottom: 0; text-align: center; }
  .ptv .bigsc { font-size: 13vh; font-weight: 700; line-height: 14vh; margin-top: 0.6vh; letter-spacing: 0.2vw; }
  .ptv .bigsc span { color: #6f7a94; font-weight: 500; margin: 0 1.2vw; }
  .ptv .clk { font-size: 3.4vh; font-weight: 600; color: #a5aec4; letter-spacing: 0.15vw; text-transform: uppercase; }
  .ptv.is-live .clk { color: #ffd5d5; }
  .ptv .kick { font-size: 7vh; font-weight: 700; line-height: 8vh; color: #f2f4f8; }
  .ptv .cols { margin-top: 1.4vh; height: 46vh; }
  .ptv .panel { float: left; height: 46vh; background: #111829; border: 0.3vh solid #1b2338; border-radius: 1.2vh;
                padding: 1.4vh 1.2vw; -webkit-box-sizing: border-box; box-sizing: border-box; overflow: hidden; }
  .ptv .p1 { width: 31%; } .ptv .p2 { width: 36%; margin: 0 1%; } .ptv .p3 { width: 31%; }
  .ptv .ph { font-size: 2.2vh; color: #f5b800; font-weight: 700; letter-spacing: 0.2vw; margin-bottom: 1vh; }
  .ptv .dd { font-size: 4.4vh; font-weight: 700; line-height: 5.2vh; }
  .ptv .dd small { display: block; font-size: 2.5vh; color: #a5aec4; font-weight: 500; line-height: 3.4vh; }
  .ptv .field { position: relative; height: 6.4vh; margin: 1.4vh 0 1.2vh 0; border-radius: 0.6vh; background: #1d5a2e; overflow: hidden; }
  .ptv .field .ez { position: absolute; top: 0; bottom: 0; width: 8%; }
  .ptv .field .yl { position: absolute; top: 0; bottom: 0; width: 0.1vw; background: rgba(255,255,255,0.35); }
  .ptv .field .los { position: absolute; top: 0; bottom: 0; width: 0.35vw; background: #4da3ff; }
  .ptv .field .fd { position: absolute; top: 0; bottom: 0; width: 0.35vw; background: #ffd400; }
  .ptv .field .fb { position: absolute; top: 2.2vh; width: 2.6vh; height: 1.8vh; margin-left: -1.3vh; border-radius: 50%; background: #8b4a22; border: 0.2vh solid #fff; }
  .ptv .field .lab { position: absolute; bottom: 0.2vh; font-size: 1.6vh; color: rgba(255,255,255,0.75); }
  .ptv .note { font-size: 2.4vh; line-height: 3.3vh; color: #c9d0e0; margin-top: 1vh; }
  .ptv .note b { color: #f5b800; font-size: 2vh; letter-spacing: 0.15vw; display: block; }
  .ptv table.q { width: 100%; border-collapse: collapse; font-size: 2.7vh; margin-bottom: 1.2vh; }
  .ptv table.q th { color: #7d8aa6; font-weight: 600; font-size: 2vh; text-align: center; padding-bottom: 0.4vh; }
  .ptv table.q td { text-align: center; padding: 0.3vh 0; font-weight: 600; }
  .ptv table.q td.t { text-align: left; font-weight: 700; }
  .ptv table.q td.tot { font-weight: 700; font-size: 3vh; }
  .ptv table.q td.na { color: #4c5872; }
  .ptv .ts { height: 3.6vh; line-height: 3.6vh; font-size: 2.4vh; position: relative; }
  .ptv .ts .k { position: absolute; left: 0; right: 0; text-align: center; color: #a5aec4; font-size: 2vh; }
  .ptv .ts .a { float: left; font-weight: 700; } .ptv .ts .h { float: right; font-weight: 700; }
  .ptv .bar { height: 0.6vh; margin-top: -0.4vh; margin-bottom: 0.2vh; background: #33405c; position: relative; }
  .ptv .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #f5b800; }
  .ptv .ld { margin-bottom: 0.5vh; }
  .ptv .ld .c { font-size: 2vh; color: #7d8aa6; font-weight: 600; letter-spacing: 0.15vw; }
  .ptv .ld .p { font-size: 3vh; font-weight: 700; line-height: 3.6vh; }
  .ptv .ld .p span { font-size: 2.2vh; color: #a5aec4; font-weight: 600; margin-left: 0.4vw; }
  .ptv .ld .v { font-size: 2.5vh; color: #c9d0e0; }
  .ptv .ln { margin-top: 1vh; padding-top: 1vh; border-top: 0.2vh solid #1b2338; font-size: 2.5vh; line-height: 3.5vh; }
  .ptv .ln b { color: #f5b800; font-size: 2vh; letter-spacing: 0.15vw; margin-right: 0.6vw; }
  .ptv .ok { color: #7bd88f; font-weight: 600; }
  .ptv .count { font-size: 7vh; font-weight: 700; letter-spacing: 0.2vw; line-height: 8vh; }
  .ptv .count small { display: block; font-size: 2.4vh; color: #a5aec4; font-weight: 500; letter-spacing: 0.15vw; line-height: 3vh; }
  .ptv .pthead { height: 4.6vh; line-height: 4.6vh; font-size: 2.8vh; color: #8892aa; letter-spacing: 0.15vw; text-transform: uppercase; margin-bottom: 1vh; }
  .ptv .pthead b { color: #f5b800; font-weight: 700; margin-right: 1vw; letter-spacing: 0.2vw; }
  .ptv .pthead .r { float: right; }
  /* squarer screens (4:3, 5:4): same layout, smaller type so it fits the narrower width */
  .narrow .ptv .pthead { font-size: 2.2vh; }
  .narrow .ptv .ptlogo .logo { width: 10vh; height: 10vh; }
  .narrow .ptv .ptlogo .logo img { left: 1vh; top: 1vh; width: 8vh; height: 8vh; }
  .narrow .ptv .ptlogo { padding-top: 4.6vh; }
  .narrow .ptv .away .txt { margin-left: 14.5vh; } .narrow .ptv .home .txt { margin-right: 14.5vh; }
  .narrow .ptv .nm { font-size: 4.6vh; line-height: 5.6vh; }
  .narrow .ptv .sub { font-size: 2vh; line-height: 2.8vh; }
  .narrow .ptv .to { width: 1.5vw; }
  .narrow .ptv .bigsc { font-size: 10vh; line-height: 12vh; margin-top: 1.6vh; }
  .narrow .ptv .clk { font-size: 2.6vh; }
  .narrow .ptv .kick { font-size: 5.4vh; line-height: 6.4vh; }
  .narrow .ptv .ph { font-size: 1.8vh; }
  .narrow .ptv .dd { font-size: 3.2vh; line-height: 4vh; }
  .narrow .ptv .dd small { font-size: 1.9vh; line-height: 2.6vh; }
  .narrow .ptv .note { font-size: 1.9vh; line-height: 2.6vh; }
  .narrow .ptv .note b, .narrow .ptv .ln b { font-size: 1.6vh; }
  .narrow .ptv table.q { font-size: 2.2vh; } .narrow .ptv table.q th { font-size: 1.6vh; } .narrow .ptv table.q td.tot { font-size: 2.4vh; }
  .narrow .ptv .ts { font-size: 2vh; height: 3vh; line-height: 3vh; } .narrow .ptv .ts .k { font-size: 1.6vh; }
  .narrow .ptv .ld .c { font-size: 1.6vh; } .narrow .ptv .ld .p { font-size: 2.4vh; line-height: 3vh; }
  .narrow .ptv .ld .p span { font-size: 1.8vh; } .narrow .ptv .ld .v { font-size: 2vh; }
  .narrow .ptv .ln { font-size: 2vh; line-height: 2.8vh; }
  .narrow .ptv .count { font-size: 5.6vh; line-height: 6.4vh; } .narrow .ptv .count small { font-size: 1.9vh; }
  .narrow .ptv .field { height: 5vh; } .narrow .ptv .field .fb { top: 1.6vh; }
  .t-bears .tab.pt { border-color: #C83803; } .t-bears .tab.pt.on { background: #C83803; color: #fff; }
  .t-bears .ptv .ph, .t-bears .ptv .note b, .t-bears .ptv .ln b, .t-bears .ptv .pthead b { color: #E65C1E; }
  .t-bears .ptv .bar i { background: #C83803; }
  .t-bears .ptv .band, .t-bears .ptv .panel { background: #0f1d36; border-color: #1b2c4c; }
  .t-bears .ptv.is-live .band { border-color: #ff3b3b; }
  .t-usc .tab.pt { border-color: #FFC72C; } .t-usc .tab.pt.on { background: #FFC72C; color: #990000; }
  .t-usc .ptv .band, .t-usc .ptv .panel { background: #2a0a0d; border-color: #451519; }
  .t-usc .ptv.is-live .band { border-color: #ffffff; }
  .t-usc .ptv .ph, .t-usc .ptv .note b, .t-usc .ptv .ln b, .t-usc .ptv .pthead b { color: #FFC72C; }
  .t-usc .ptv .bar i { background: #FFC72C; }
  .t-usc .ptv .sub, .t-usc .ptv .ts .k, .t-usc .ptv .dd small { color: #e2c7c0; }

  /* =========== THEMES (picked automatically by day, see CONFIG.theme) =========== */

  /* Chicago Bears: navy + orange (Sunday - Friday) */
  body.t-bears { background: #050a14; }
  .t-bears #top, .t-bears #crawlbar { background: #0B162A; border-color: #C83803; }
  .t-bears #brand span, .t-bears #crawl .lg, .t-bears .rk { color: #E65C1E; }
  .t-bears .tab { color: #7d8aa6; }
  .t-bears .tab.on { background: #C83803; color: #ffffff; }
  .t-bears .tab.empty { color: #26324a; }
  .t-bears .card { background: #0f1d36; border-color: #1b2c4c; }
  .t-bears .row + .row { border-color: #1b2c4c; }
  .t-bears .abbr { background: #1a2d52; }
  .t-bears .status { background: #0B162A; }
  .t-bears .lines { border-color: #1b2c4c; }
  .t-bears .lines .lbl { color: #E65C1E; }
  .t-bears .card.fav { border-color: #C83803; }
  .t-bears .card.live { border-color: #ff3b3b; }
  .t-bears .card.live.fav { border-color: #C83803; }
  .t-bears #crawllabel { background: #C83803; color: #ffffff; }
  .t-bears #crawl .hl { background: #C83803; color: #ffffff; }
  .t-bears #crawl .nl { color: #E65C1E; }

  /* USC Trojans: cardinal + gold (Saturday) */
  body.t-usc { background: #120304; }
  .t-usc #top, .t-usc #crawlbar { background: #990000; border-color: #FFC72C; }
  .t-usc #brand, .t-usc #clock { color: #ffffff; }
  .t-usc #brand span, .t-usc #crawl .lg, .t-usc .rk { color: #FFC72C; }
  .t-usc #clock small { color: #ffd9a0; }
  .t-usc .tab { color: #f0b9b0; }
  .t-usc .tab.on { background: #FFC72C; color: #990000; }
  .t-usc .tab.empty { color: #6b1a1a; }
  .t-usc #heading .sub, .t-usc #heading .page { color: #c9a9a3; }
  .t-usc .card { background: #2a0a0d; border-color: #451519; }
  .t-usc .row + .row { border-color: #451519; }
  .t-usc .abbr { background: #4d171c; }
  .t-usc .name { color: #e2c7c0; }
  .t-usc .lose .score, .t-usc .lose .abbr { color: #8c6a66; }
  .t-usc .status { background: #1c0507; color: #e2c7c0; }

<body>
<div id="shift">
  <div id="top">
    <div id="tabs"></div>
    <div id="brand">Score<span>board</span></div>
    <div id="clock"></div>
  </div>

  <div id="board">
    <div id="heading"></div>
    <div id="cards"></div>
    <div id="msg">Loading scores&hellip;</div>
  </div>

  <div id="crawlbar">
    <div id="crawl"></div>
    <div id="crawllabel">SCORES</div>
  </div>

  <div id="foot"><span id="updated">Connecting&hellip;</span><span class="r">Data: SportsBlaze &middot; ESPN &middot; Opening lines: DraftKings</span></div>
</div>

<script>
/* =================== CONFIG (edit me) =================== */
var CONFIG = {
  // Leagues to show, in this order.
  //   From SportsBlaze: nfl, nba, mlb, wnba
  //   From ESPN:        ncaaf (college football), ncaab (men's college basketball), nhl,
  //                     ufc (main card fights only)
  leagues: ['nfl', 'ncaaf', 'nba', 'mlb', 'wnba', 'ufc'],

  // Season change: starting on this date, WNBA comes off and men's college basketball
  // goes on (right after the NBA). Happens by itself; no update needed that day.
  seasonSwitch: { on: '2026-11-01', remove: 'wnba', add: 'ncaab', after: 'nba' },

  // Men's college basketball: 'top25' = games with a ranked team, 'all' = every Division I game
  cbb: 'top25',

  // College football: 'top25' = games with a ranked team, 'fbs' = every FBS game
  cfb: 'top25',

  // Colors: 'auto' = Bears on Sunday-Friday, USC on Saturday.
  // Or force one: 'bears', 'usc', 'classic' (the original navy + gold)
  theme: 'auto',

  // Your teams, per league (team abbreviations). They get a highlighted border and go first.
  // Kept per league so 'CHI' (Bears) doesn't also highlight the Chicago Sky, and 'PHI' (Eagles)
  // doesn't also highlight the 76ers or Phillies.
  favorites: {
    nfl:   ['CHI', 'PHI'],   // Bears, Eagles
    ncaaf: ['USC', 'WIS'],   // USC Trojans, Wisconsin Badgers
    nba:   ['SA', 'CHI'],    // Spurs, Bulls
    mlb:   ['CHW', 'CWS']    // White Sox (both common abbreviations)
  },

  // Leagues that also show games that haven't started yet. The season schedule
  // file is large for MLB, so it's off for MLB by default to go easy on old TVs.
  upcoming: ['nfl', 'nba', 'wnba'],

  refreshLiveSec: 30,    // how often to refresh scores while any game is live
  refreshIdleSec: 30,    // how often to refresh scores when nothing is live
  newsEveryMin: 10,      // how often to refresh headlines
  linesEveryMin: 15,     // how often to check for opening lines not captured yet
  rotateSec: 12,         // seconds each screen of cards stays up
  primetimeHoldLive: 60, // NFL primetime screen: seconds it stays up during the game (returns after every other screen)
  primetimeHoldPre: 30,  // ...and before kickoff / after the final (once per loop)
  windowHours: 24,       // screens show live games and games starting within this many hours...
  resultsHours: 12,      // ...plus results of games that ended within this many hours
  cardsPerPage: 6,       // 2 rows of 3 (bigger cards, easier to read from across the room)
  lookbackDays: 7,       // if a league has no games today, show its most recent results
  crawlSpeed: 90,        // bottom ticker speed (pixels per second)
  crawlPerSegment: 5,    // games per bottom-bar segment
  crawlMaxPerLeague: 10, // most games per league in the bottom bar (your teams + live first)
  crawlStats: true,      // key stats in the bottom bar for live games + your teams' games
  crawlNews: true,       // league headlines in the bottom bar
  newsPerLeague: 2       // headlines per league
};
/* ======================================================== */

var API = 'https://cache.sportsblaze.com';
var ESPN_API = 'https://site.api.espn.com/apis/site/v2/sports/';
var ESPN_PATHS = { ncaaf: 'football/college-football', ncaab: 'basketball/mens-college-basketball', nhl: 'hockey/nhl',
                   nfl: 'football/nfl', nba: 'basketball/nba', mlb: 'baseball/mlb', wnba: 'basketball/wnba' };
/* Leagues SportsBlaze also carries: used as a backup only if ESPN can't be reached. */
var SB_LEAGUES = { nfl: true, nba: true, mlb: true, wnba: true };
var LEAGUE_NAMES = { nfl: 'NFL', nba: 'NBA', mlb: 'MLB', wnba: 'WNBA', ncaaf: 'NCAAF', ncaab: 'NCAAB', nhl: 'NHL', ufc: 'UFC' };
var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

var state = { data: {}, pages: [], pageIndex: 0, lastOk: null, failures: 0, crawlKey: '' };
var cache = { lookback: {}, schedule: {} };
var DEMO = false;

/* ---------- small helpers ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function inList(list, v) { for (var i = 0; i < list.length; i++) { if (list[i] === v) return true; } return false; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function timeStr(d) {
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + pad(m) + ' ' + ap;
}
function parseDate(s) {
  var d = new Date(s);
  if (isNaN(d.getTime()) && s) {           // very old browsers: parse ISO by hand
    var p = String(s).match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
    if (p) d = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3], +p[4], +p[5]));
  }
  return d;
}
function ordinal(n) {
  var s = ['TH', 'ST', 'ND', 'RD'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function seasonYear(lg, now) {
  var y = now.getFullYear(), m = now.getMonth() + 1;
  if (lg === 'nba') return m >= 8 ? y : y - 1;   // 2026-27 NBA season = 2026
  if (lg === 'nfl') return m >= 3 ? y : y - 1;   // Jan/Feb playoffs belong to last year's season
  return y;
}

function readParams() {
  var q = window.location.search.replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split('='), k = kv[0], v = decodeURIComponent(kv[1] || '');
    if (!k) continue;
    if (k === 'leagues' && v) { CONFIG.leagues = v.toLowerCase().split(','); CONFIG.seasonSwitch = null; }
    if (k === 'cbb' && v) CONFIG.cbb = v.toLowerCase();
    if (k === 'fav') CONFIG.favorites = v ? v.toUpperCase().split(',') : [];
    if (k === 'upcoming') CONFIG.upcoming = v ? v.toLowerCase().split(',') : [];
    if (k === 'rotate' && +v > 2) CONFIG.rotateSec = +v;
    if (k === 'cfb' && v) CONFIG.cfb = v.toLowerCase();
    if (k === 'theme' && v) CONFIG.theme = v.toLowerCase();
    if (k === 'stats') CONFIG.crawlStats = v !== '0';
    if (k === 'news') CONFIG.crawlNews = v !== '0';
    if (k === 'demo' && v !== '0') DEMO = true;
  }
}

/* ---------- networking (XMLHttpRequest works everywhere) ---------- */
function getJSON(url, cb) {
  var done = false;
  function finish(err, data) { if (!done) { done = true; cb(err, data); } }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    try { x.timeout = 20000; } catch (t) {}
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var data = null;
        try { data = JSON.parse(x.responseText); } catch (e) { return finish('bad data'); }
        finish(null, data);
      } else {
        finish('HTTP ' + x.status);
      }
    };
    x.ontimeout = function () { finish('timeout'); };
    x.onerror = function () { finish('network'); };
    x.send();
  } catch (e) { finish('network'); }
}

/* One day of games for any league, whichever feed it comes from. */
/* Pro leagues switch to ESPN for the rest of the session if SportsBlaze comes up empty. */
var viaEspn = {};
var useBackup = {};
function fromEspnFeed(lg) { return !useBackup[lg] && !!(ESPN_PATHS[lg] || viaEspn[lg]); }
function dayGames(lg, dateStr, cb) {
  if (DEMO) return cb(null, demoEvents(lg, dateStr));
  if (fromEspnFeed(lg)) return espnDay(lg, dateStr, cb);
  boxscores(lg, dateStr, cb);
}

/* ---- ESPN feed (college football etc.), converted to the same shape as SportsBlaze ---- */
function espnDay(lg, dateStr, cb) {
  var url = ESPN_API + (ESPN_PATHS[lg] || ESPN_ODDS_PATHS[lg]) + '/scoreboard?dates=' + dateStr.replace(/-/g, '');
  if (lg === 'ncaaf' && CONFIG.cfb === 'fbs') url += '&groups=80&limit=200';
  if (lg === 'ncaab' && CONFIG.cbb === 'all') url += '&groups=50&limit=400';
  getJSON(url, function (err, data) {
    if (err) return cb(err);
    var evs = (data && data.events) || [], out = [];
    for (var i = 0; i < evs.length; i++) { var g = fromEspn(evs[i], lg); if (g) out.push(g); }
    cb(null, out);
  });
}
function fromEspn(ev, lg) {
  var c = (ev.competitions && ev.competitions[0]) || {}, st = ev.status || c.status || {}, ty = st.type || {};
  var teams = {}, total = { away: '', home: '' }, comps = c.competitors || [];
  for (var i = 0; i < comps.length; i++) {
    var cp = comps[i], t = cp.team || {}, side = cp.homeAway === 'home' ? 'home' : 'away';
    var rk = cp.curatedRank && cp.curatedRank.current;
    teams[side] = { abbreviation: t.abbreviation || '', name: t.displayName || '',
                    short: t.shortDisplayName || t.location || '', rank: rk && rk <= 25 ? rk : 0,
                    logo: t.logo || '', color: t.color || '', alt: t.alternateColor || '', tid: t.id || '' };
    total[side] = cp.score != null ? cp.score : '';
  }
  if (!teams.away || !teams.home) return null;
  recordLine(ev, c);
  readExtras(ev, c);
  var desc = ty.description || '', state = ty.state;
  var live = state === 'in';
  var fin = state === 'post' && !/postpon|cancel|suspend|delay/i.test(desc);
  return {
    id: 'espn' + ev.id, teams: teams, date: ev.date, live: live,
    status: live ? (desc || 'In Progress') : (fin ? 'Final' : (desc || 'Scheduled')),
    detail: ty.shortDetail || '', espn: true, eid: ev.id, raw: lg === 'nfl' ? ev : null,
    scores: (live || fin) ? { total: total } : null
  };
}

/* ---- Opening spread & over/under (DraftKings, via ESPN) ----
   ESPN can drop the lines once a game starts, so each opening line is saved the first
   time it's seen (in memory + the browser's storage) and kept until the game is old. */
var ESPN_ODDS_PATHS = { nfl: 'football/nfl', nba: 'basketball/nba', mlb: 'baseball/mlb', wnba: 'basketball/wnba' };
var LINES_KEY = 'tickerOpenLines';
var lines = (function () {
  try { return JSON.parse(window.localStorage.getItem(LINES_KEY)) || {}; } catch (e) { return {}; }
})();
function saveLines() {
  if (DEMO) return;                                // never store fake demo lines
  try {
    var cut = ymd(addDays(new Date(), -10));
    for (var k in lines) if (lines.hasOwnProperty(k) && k.substr(0, 10) < cut) delete lines[k];
    window.localStorage.setItem(LINES_KEY, JSON.stringify(lines));
  } catch (e) {}
}
function gameKey(dateStr, awayName, homeName) {
  return ymd(parseDate(dateStr)) + '|' + nickname(awayName).toLowerCase() + '@' + nickname(homeName).toLowerCase();
}
function keyOf(e) { return gameKey(e.date, e.teams.away.name, e.teams.home.name); }
function recordLine(ev, c) {
  var o = c && c.odds && c.odds[0];
  if (!o) return;
  var comps = c.competitors || [], names = {};
  for (var i = 0; i < comps.length; i++) {
    names[comps[i].homeAway === 'home' ? 'home' : 'away'] = (comps[i].team || {}).displayName;
  }
  if (!names.away || !names.home) return;
  var key = gameKey(ev.date, names.away, names.home);
  if (lines[key]) return;                          // opening line never changes: keep the first one
  var ps = o.pointSpread || {};
  var hl = ps.home && ps.home.open && ps.home.open.line, al = ps.away && ps.away.open && ps.away.open.line;
  var tl = o.total && o.total.over && o.total.over.open && o.total.over.open.line;
  var rec = {};
  if (hl || al) {
    if (/^-/.test(hl)) { rec.side = 'home'; rec.line = hl; }
    else if (/^-/.test(al)) { rec.side = 'away'; rec.line = al; }
    else rec.line = 'PK';
  }
  if (tl) rec.total = String(tl).replace(/^[ou]\s*/i, '');
  if (rec.line || rec.total) lines[key] = rec;
}
/* ---- Key game stats for the bottom bar (ESPN): who has the ball + top performers ---- */
var extras = {};
var STAT_LABELS = { passingYards: 'PASS', rushingYards: 'RUSH', receivingYards: 'REC', points: 'PTS',
                    rebounds: 'REB', assists: 'AST', goals: 'G', hits: 'H', homeRuns: 'HR', RBIs: 'RBI' };
function athleteName(ent) {
  var a = ent && ent.athlete;
  return a ? (a.shortName || a.displayName || '') : '';
}
function readExtras(ev, c) {
  if (!c) return;
  var ty = (ev.status && ev.status.type) || (c.status && c.status.type) || {};
  if (ty.state !== 'in' && ty.state !== 'post') return;
  var comps = c.competitors || [], names = {}, abbrById = {}, i, parts = [];
  for (i = 0; i < comps.length; i++) {
    var t = comps[i].team || {};
    names[comps[i].homeAway === 'home' ? 'home' : 'away'] = t.displayName;
    if (t.id) abbrById[t.id] = t.abbreviation;
    if (comps[i].id) abbrById[comps[i].id] = t.abbreviation;
  }
  if (!names.away || !names.home) return;
  var s = c.situation;                             // football: ball + down & distance while live
  var sit = '';
  if (s && ty.state === 'in') {
    var dd = s.downDistanceText || s.shortDownDistanceText;
    var who = s.possession ? abbrById[s.possession] : '';
    if (dd) { sit = (who ? who + ' ball, ' : '') + dd + (s.isRedZone ? ' (RED ZONE)' : ''); parts.push(sit); }
  }
  var L = c.leaders || [];                         // football: game leaders by category
  for (i = 0; i < L.length && i < 3; i++) {
    var ent = L[i].leaders && L[i].leaders[0];
    if (ent && ent.displayValue) {
      var lab = STAT_LABELS[L[i].name] || L[i].abbreviation || L[i].shortDisplayName || '';
      parts.push(String(lab).toUpperCase() + ' ' + athleteName(ent) + ' ' + ent.displayValue);
    }
  }
  if (!L.length) {                                 // basketball/hockey: each team's top scorer
    for (i = 0; i < comps.length; i++) {
      var cl = comps[i].leaders || [];
      for (var k = 0; k < cl.length; k++) {
        if (cl[k].name !== 'points' && cl[k].name !== 'goals') continue;
        var e2 = cl[k].leaders && cl[k].leaders[0];
        if (e2) parts.push((comps[i].team || {}).abbreviation + ' ' + athleteName(e2) + ' ' +
                           e2.displayValue + ' ' + STAT_LABELS[cl[k].name]);
      }
    }
  }
  if (parts.length) extras[gameKey(ev.date, names.away, names.home)] = { all: parts.join('  ·  '), sit: sit };
}

/* Pro leagues get scores from SportsBlaze, so look up their lines (and live stats) on ESPN
   by date + team. Today's board is re-read every refresh while games are live. */
function fetchLines(lg, games, cb) {
  if (DEMO) { demoLines(games); return cb(); }
  var path = fromEspnFeed(lg) ? '' : ESPN_ODDS_PATHS[lg];
  if (!path) return cb();                          // ESPN-fed leagues already recorded theirs
  cache.linesAt = cache.linesAt || {};
  var now = new Date().getTime(), today = ymd(new Date()), seen = {}, list = [], i, liveToday = false;
  for (i = 0; i < games.length; i++) {
    var d = ymd(parseDate(games[i].date));
    if (d === today && (games[i].live || (isFinal(games[i]) && isFav(games[i], lg)))) liveToday = true;
    if (lines[keyOf(games[i])]) continue;
    if (!seen[d]) { seen[d] = true; list.push(d); }
  }
  if (CONFIG.crawlStats && liveToday && !seen[today]) list.unshift(today);
  list = list.slice(0, 8);
  var n = 0;
  function step() {
    if (n >= list.length) return cb();
    var d = list[n++], ck = lg + d;
    var ttl = (d === today && liveToday) ? 25000 : CONFIG.linesEveryMin * 60000;
    if (cache.linesAt[ck] && now - cache.linesAt[ck] < ttl) return step();
    getJSON(ESPN_API + path + '/scoreboard?dates=' + d.replace(/-/g, ''), function (err, data) {
      cache.linesAt[ck] = now;
      var evs = (!err && data && data.events) || [];
      for (var j = 0; j < evs.length; j++) {
        var c = evs[j].competitions && evs[j].competitions[0];
        recordLine(evs[j], c);
        readExtras(evs[j], c);
      }
      step();
    });
  }
  step();
}

/* ---- Headlines (ESPN news), refreshed every CONFIG.newsEveryMin minutes ---- */
var news = { at: 0, items: [] };
function loadNews(cb) {
  if (!CONFIG.crawlNews) { news.items = []; return cb(); }
  if (DEMO) { news.items = demoNews(); return cb(); }
  var now = new Date().getTime();
  if (news.at && now - news.at < CONFIG.newsEveryMin * 60000) return cb();
  var items = [], i = 0, ok = 0;
  function step() {
    if (i >= CONFIG.leagues.length) {
      if (ok) news.items = items;                  // keep old headlines if every request failed
      news.at = now;
      return cb();
    }
    var lg = CONFIG.leagues[i++], path = ESPN_ODDS_PATHS[lg] || ESPN_PATHS[lg] || (lg === 'ufc' ? 'mma/ufc' : '');
    if (!path) return step();
    getJSON(ESPN_API + path + '/news?limit=' + CONFIG.newsPerLeague, function (err, data) {
      var arts = (!err && data && data.articles) || [];
      if (!err) ok++;
      for (var j = 0; j < arts.length && j < CONFIG.newsPerLeague; j++) {
        if (arts[j].headline) items.push({ lg: lg, h: arts[j].headline });
      }
      step();
    });
  }
  step();
}

function boxscores(lg, dateStr, cb) {
  getJSON(API + '/boxscores/' + lg + '/' + dateStr, function (err, data) {
    if (err) return cb(err);
    var evs = (data && data.events) || [];
    for (var i = 0; i < evs.length; i++) { evs[i].players = null; evs[i].statistics = null; } // free memory
    cb(null, evs);
  });
}

/* Season schedule: only used to find games that haven't started yet. Cached 30 min. */
function upcomingGames(lg, now, cb) {
  if (!inList(CONFIG.upcoming, lg) || DEMO || fromEspnFeed(lg)) return cb([]);
  var c = cache.schedule[lg];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  getJSON(API + '/schedule/' + lg + '/' + seasonYear(lg, now), function (err, data) {
    if (err) return cb(c ? c.events : []);
    var all = (data && data.events) || [], keep = [];
    var from = now.getTime() - 6 * 3600000, to = addDays(now, 8).getTime();
    for (var i = 0; i < all.length; i++) {
      var e = all[i], t = parseDate(e.date).getTime();
      if (t >= from && t <= to && !e.live && !/final/i.test(e.status || '')) {
        keep.push({ id: e.id, teams: e.teams, date: e.date, live: false, status: e.status, season: e.season });
      }
    }
    all = null; data = null;
    cache.schedule[lg] = { at: now.getTime(), events: keep };
    cb(keep);
  });
}

/* If a league has nothing today, walk back day by day to the latest results. Cached 30 min. */
function latestResults(lg, now, cb) {
  var c = cache.lookback[lg];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  var n = 1;
  function step() {
    if (n > CONFIG.lookbackDays) { cache.lookback[lg] = { at: now.getTime(), events: [] }; return cb([]); }
    dayGames(lg, ymd(addDays(now, -n)), function (err, evs) {
      if (!err && evs.length) { cache.lookback[lg] = { at: now.getTime(), events: evs }; return cb(evs); }
      n++; step();
    });
  }
  step();
}

/* ESPN leagues: if nothing today, look ahead day by day to the next game day. Cached 30 min. */
function nextGameDay(lg, now, cb) {
  if (!fromEspnFeed(lg) && !DEMO) return cb([]);
  var key = 'next_' + lg, c = cache.lookback[key];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  var n = 1;
  function step() {
    if (n > 6) { cache.lookback[key] = { at: now.getTime(), events: [] }; return cb([]); }
    dayGames(lg, ymd(addDays(now, n)), function (err, evs) {
      if (!err && evs.length) { cache.lookback[key] = { at: now.getTime(), events: evs }; return cb(evs); }
      n++; step();
    });
  }
  step();
}

/* College football: every game from tomorrow through Saturday, so the week's slate is
   always on screen. Cached 30 min so it adds only a few requests per half hour. */
function weekAhead(lg, now, cb) {
  if (lg !== 'ncaaf' && !(lg === 'nfl' && fromEspnFeed(lg))) return cb([]);
  var key = 'week_' + lg, c = cache.lookback[key];
  if (c && now.getTime() - c.at < 30 * 60000) return cb(c.events);
  // college: through Saturday (Sat -> none). NFL: the next 7 days.
  var days = lg === 'nfl' ? 7 : 6 - now.getDay(), n = 1, all = [];
  function step() {
    if (n > days) { cache.lookback[key] = { at: now.getTime(), events: all }; return cb(all); }
    dayGames(lg, ymd(addDays(now, n)), function (err, evs) {
      if (!err) all = all.concat(evs);
      n++; step();
    });
  }
  step();
}

function loadLeagueOnce(lg, cb) {

      if (c && c.day === yd && now.getHours() >= 5 && now.getTime() - c.at < 10 * 60000) return use(c.events);
      dayGames(lg, yd, function (e2, y) {

    games = games.slice(0, CONFIG.crawlMaxPerLeague);
    var name = LEAGUE_NAMES[lg] || lg.toUpperCase();
    for (var k = 0; k < games.length; k += CONFIG.crawlPerSegment) {
      var html = '';
      for (var m = k; m < k + CONFIG.crawlPerSegment && m < games.length; m++) {
        var e = games[m], sx = '';
        if (CONFIG.crawlStats) {
          if (isFav(e, lg) && (e.live || isFinal(e))) sx = e.extra;   // your teams: full stats
          else if (e.live) sx = e.sit;                                // others: just ball + down
        }
        html += crawlGameHTML(e, lg, sx);
      }
      segs.push({ label: name, html: html });
    }
    if (segs.length) groups.push(segs);
  }
  if (CONFIG.crawlNews && news.items.length) {
    var ns = [];
    for (var n = 0; n < news.items.length; n += 3) {
      var nh = '';
      for (var q = n; q < n + 3 && q < news.items.length; q++) {
        var it = news.items[q];
        nh += '<span class="n"><span class="nl">' + (LEAGUE_NAMES[it.lg] || it.lg.toUpperCase()) + '</span>' + esc(it.h) + '</span>';
      }
      ns.push({ label: 'HEADLINES', html: nh });
    }
    groups.push(ns);
  }
  // take turns: first segment of each league, then the second of each, and so on
  var out = [], more = true;
  for (var r = 0; more; r++) {
    more = false;
    for (var g = 0; g < groups.length; g++) if (groups[g][r]) { out.push(groups[g][r]); more = true; }
  }
  state.crawlSegs = out;                           // picked up when the current segment finishes
  if (!state.crawlRunning) playSegment(0);
}
function setX(el, x, secs) {
  el.style.webkitTransition = secs ? '-webkit-transform ' + secs + 's linear' : 'none';
  el.style.transition = secs ? 'transform ' + secs + 's linear' : 'none';
  el.style.webkitTransform = 'translateX(' + x + 'px)';
  el.style.transform = 'translateX(' + x + 'px)';
}
function playSegment(i) {
  var segs = state.crawlSegs || [], el = $('crawl');
  if (state.crawlTimer) { clearTimeout(state.crawlTimer); state.crawlTimer = null; }
  if (!segs.length) {
    el.innerHTML = ''; $('crawllabel').innerHTML = 'SCORES'; state.crawlRunning = false; return;
  }
  i = i % segs.length;
  state.crawlIdx = i;
  var seg = segs[i];
  $('crawllabel').innerHTML = esc(seg.label);
  el.innerHTML = seg.html;
  var start = $('crawlbar').offsetWidth, w = el.offsetWidth;
  var secs = Math.max(4, Math.round((start + w) / CONFIG.crawlSpeed));
  setX(el, start, 0);                              // park just off the right edge
  void el.offsetWidth;
  setX(el, -w, secs);                              // scroll until fully off the left edge
  state.crawlRunning = true;
  state.crawlTimer = setTimeout(function () { playSegment(state.crawlIdx + 1); }, secs * 1000 + 300);
}

/* Saturday = USC, every other day = Bears (unless a theme is forced) */
function applyTheme(d) {
  var t = CONFIG.theme;
  if (t === 'auto') t = d.getDay() === 6 ? 'usc' : 'bears';
  var cls = t === 'classic' ? '' : 't-' + t;
  var vw = window.innerWidth || document.documentElement.clientWidth, vh = window.innerHeight || document.documentElement.clientHeight;
  if (vh && vw / vh < 1.6) cls += (cls ? ' ' : '') + 'narrow';
  if (document.body.className !== cls) document.body.className = cls;
}

function renderClock() {
  var d = new Date();
  applyTheme(d);
  $('clock').innerHTML = '<small>' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + '</small>' + timeStr(d);
}

function renderFoot(errs) {
  var t = state.lastOk ? 'Updated ' + timeStr(state.lastOk) : 'Connecting…';
  if (errs) t += '  ·  ' + errs + ' league(s) failed to load, retrying';
  $('updated').innerHTML = esc(t) + (DEMO ? '  ·  DEMO DATA' : '');
}

/* ---------- main loop ---------- */
/* Swap leagues when the season-change date arrives (checked on every refresh). */
function applySeasonSwitch() {
  var s = CONFIG.seasonSwitch;
  if (!s || ymd(new Date()) < s.on) return;
  var out = [], i, added = inList(CONFIG.leagues, s.add);
  for (i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i];
    if (lg === s.remove) continue;
    out.push(lg);
    if (lg === s.after && !added) { out.push(s.add); added = true; }
  }
  if (!added) out.push(s.add);
  CONFIG.leagues = out;
  delete state.data[s.remove];
  CONFIG.seasonSwitch = null;                      // done
}

function refreshAll() {
  applySeasonSwitch();
  var i = 0, errs = 0, anyLive = false;
  function next() {
    if (i >= CONFIG.leagues.length) return finished();
    var lg = CONFIG.leagues[i++];
    loadLeague(lg, function (err, res) {
      if (err) { errs++; return next(); }        // keep the last good data on screen
      fetchLines(lg, res.games, function () {
        for (var k = 0; k < res.games.length; k++) {
          res.games[k].open = lines[keyOf(res.games[k])] || null;
          var ex = extras[keyOf(res.games[k])] || {};
          res.games[k].extra = ex.all || '';
          res.games[k].sit = ex.sit || '';
          if (res.games[k].live) anyLive = true;
        }
        state.data[lg] = res;
        next();
      });
    });
  }
  function finished() {
    saveLines();
    if (errs < CONFIG.leagues.length) { state.lastOk = new Date(); state.failures = 0; }
    else state.failures++;
    if (!state.lastOk && state.failures) {
      var m = $('msg'); m.style.display = 'block';
      m.innerHTML = 'Can&rsquo;t reach SportsBlaze<small>Check that this screen is connected to the internet. ' +
        'Retrying automatically&hellip;</small>';
    }
    var wait = state.failures ? 30 : (anyLive ? CONFIG.refreshLiveSec : CONFIG.refreshIdleSec);
    loadTeams(function () { loadNews(function () { loadPtDetails(function () {
      buildPages(); renderPage(); renderCrawl(); renderFoot(errs);
      setTimeout(refreshAll, wait * 1000);
    }); }); });
  }
  next();
}

function rotate() {
  if (state.pages.length > 1) { state.pageIndex = (state.pageIndex + 1) % state.pages.length; renderPage(); }
  scheduleRotate();
}
function scheduleRotate() {                              // each screen can have its own hold time
  if (state.rotTimer) clearTimeout(state.rotTimer);
  var pg = state.pages[state.pageIndex];
  state.rotTimer = setTimeout(rotate, ((pg && pg.hold) || CONFIG.rotateSec) * 1000);
}

/* nudge everything a few pixels every 10 min to protect older screens from burn-in */
function antiBurn() {
  var s = $('shift');
  s.style.top = Math.round(Math.random() * 4 - 2) + 'px';
  s.style.left = Math.round(Math.random() * 4 - 2) + 'px';
}

/* ---------- demo data (?demo=1) ---------- */
function demoUfc() {
  var at = new Date(); at.setHours(21, 0, 0, 0);
  function f(n, last, rec) { return { abbreviation: last, name: n, short: rec, rank: 0 }; }
  var g = [
    { id: 'u1', ufc: true, teams: { away: f('Fighter One', 'MAKHACHEV', '27-1-0'), home: f('Fighter Two', 'DELLA MADDALENA', '18-2-0') },
      date: at.toISOString(), live: false, status: 'Scheduled', wclass: 'Welterweight', order: 1, mainEvent: true },
    { id: 'u2', ufc: true, teams: { away: f('Fighter Three', 'SHEVCHENKO', '24-4-1'), home: f('Fighter Four', 'ZHANG', '25-3-0') },
      date: at.toISOString(), live: true, status: 'In Progress', detail: 'R2 3:21', wclass: "Women's Flyweight", order: 2 },
    { id: 'u3', ufc: true, teams: { away: f('Fighter Five', 'PRATES', '22-6-0'), home: f('Fighter Six', 'GARRY', '16-1-0') },
      date: at.toISOString(), live: false, status: 'Final', detail: 'KO/TKO R1 4:31', wclass: 'Welterweight', order: 3,
      winner: 'away', scores: { total: { away: 'W', home: '' } } }
  ];
  return { games: g, label: 'UFC 322 · Main card · Tonight' };
}
function demoNews() {
  return [{ lg: 'nfl', h: 'Bears activate starting left tackle ahead of Sunday matchup' },
          { lg: 'ncaaf', h: 'USC moves up two spots in latest AP poll after road win' },
          { lg: 'nba', h: 'Spurs extend win streak behind big night from their center' }];
}
function demoLines(games) {
  for (var j = 0; j < games.length; j++) {
    var g = games[j];
    if (g.live) extras[keyOf(g)] = g.espn
      ? { all: 'OSU ball, 2nd & 7 at IU 34  ·  PASS W. Howard 14/20, 180 YDS  ·  RUSH T. Henderson 12 CAR, 88 YDS', sit: 'OSU ball, 2nd & 7 at IU 34' }
      : { all: g.teams.away.abbreviation + ' A. Player 24 PTS  ·  ' + g.teams.home.abbreviation + ' B. Player 19 PTS', sit: '' };
    if (isFinal(g) && g.teams.away.abbreviation === 'SA') extras[keyOf(g)] = { all: 'SA V. Wembanyama 31 PTS  ·  DAL L. Player 27 PTS', sit: '' };
  }
  for (var i = 0; i < games.length; i++) {
    if (i % 4 === 3) continue;                     // leave some games without a line
    var k = keyOf(games[i]);
    if (!lines[k]) lines[k] = { side: i % 2 ? 'home' : 'away', line: '-' + (1.5 + i * 2), total: '' + (44.5 + i * 3) };
  }
}
function demoEvents(lg, dateStr) {
  var today = ymd(new Date());
  if (lg === 'ncaaf') {
    var sat = addDays(new Date(), 6 - new Date().getDay());
    if (dateStr === ymd(sat) && dateStr !== today) {
      var k1 = new Date(sat.getTime()); k1.setHours(11, 0, 0, 0);
      return [{ id: 'cf9', espn: true, teams: { away: { abbreviation: 'PITT', name: 'Pittsburgh', short: 'Pittsburgh', rank: 0 },
        home: { abbreviation: 'MIA', name: 'Miami', short: 'Miami', rank: 1 } }, date: k1.toISOString(),
        live: false, status: 'Scheduled', detail: '' }];
    }
    if (dateStr !== today) return [];
    var at = new Date(); at.setHours(19, 0, 0, 0);
    function tm(ab, short, rank) { return { abbreviation: ab, name: short, short: short, rank: rank }; }
    return [
      { id: 'cf1', espn: true, teams: { away: tm('OSU', 'Ohio State', 4), home: tm('IU', 'Indiana', 5) }, date: at.toISOString(),
        live: true, status: 'In Progress', detail: '8:32 - 3rd', scores: { total: { away: 17, home: 14 } } },
      { id: 'cf2', espn: true, teams: { away: tm('FLA', 'Florida', 0), home: tm('TEX', 'Texas', 7) }, date: at.toISOString(),
        live: false, status: 'Final', detail: 'Final/OT', scores: { total: { away: 27, home: 30 } } },
      { id: 'cf3', espn: true, teams: { away: tm('NEB', 'Nebraska', 0), home: tm('ORE', 'Oregon', 13) },
        date: new Date(at.getTime() + 3 * 3600000).toISOString(), live: false, status: 'Scheduled', detail: '' }
    ];
  }
  var T = {
    nba: [['ATL', 'Atlanta Hawks'], ['ORL', 'Orlando Magic'], ['MIL', 'Milwaukee Bucks'], ['WAS', 'Washington Wizards'],
          ['SA', 'San Antonio Spurs'], ['DAL', 'Dallas Mavericks'], ['NY', 'New York Knicks'], ['BOS', 'Boston Celtics'],
          ['LAL', 'Los Angeles Lakers'], ['GS', 'Golden State Warriors'], ['DEN', 'Denver Nuggets'], ['PHX', 'Phoenix Suns']],
    nfl: [['HOU', 'Houston Texans'], ['JAX', 'Jacksonville Jaguars'], ['DAL', 'Dallas Cowboys'], ['GB', 'Green Bay Packers'],
          ['KC', 'Kansas City Chiefs'], ['LAC', 'Los Angeles Chargers']],
    mlb: [['LAD', 'Los Angeles Dodgers'], ['NYY', 'New York Yankees']]
  }[lg];
  if (!T) return [];
  if (lg === 'nfl' && dateStr === today) return [];
  if (lg === 'nfl' && dateStr !== ymd(addDays(new Date(), -3))) return [];
  if (lg === 'mlb' && dateStr !== today) return [];
  if (lg === 'nba' && dateStr !== today) return [];
  var out = [], base = new Date(); base.setHours(18, 30, 0, 0);
  for (var i = 0; i + 1 < T.length; i += 2) {
    var k = i / 2, live = lg !== 'nfl' && k % 3 !== 2, fin = lg === 'nfl' || k % 3 === 2;
    if (lg === 'nba' && k >= 4) { live = false; fin = false; }
    var ev = {
      id: lg + k, teams: { away: { abbreviation: T[i][0], name: T[i][1] }, home: { abbreviation: T[i + 1][0], name: T[i + 1][1] } },
      date: new Date(base.getTime() + k * 1800000).toISOString(), live: live,
      status: live ? 'In Progress' : (fin ? 'Final' : 'Scheduled')
    };
    if (live || fin) {
      ev.scores = { total: { away: 80 + k * 13 % 40, home: 75 + k * 17 % 45 }, periods: { 1: {}, 2: {}, 3: {}, 4: {} } };
      if (lg === 'nfl') ev.scores.total = { away: 17 + k * 7, home: 20 + k * 3 };
      if (lg === 'mlb') { ev.scores.total = { away: 3, home: 5 }; ev.period = 7; ev.half = 'Top'; }
      if (lg === 'nba' && live) { ev.period = 3 + (k % 2); ev.clock = (k + 2) + ':' + pad(k * 11 % 60); }
    }
    if (lg === 'nba' && k === 4) ev.date = new Date(base.getTime() + 3 * 3600000).toISOString();
    out.push(ev);
  }
  return out;
}

/* ---------- start ---------- */
readParams();
renderClock(); setInterval(renderClock, 10000);
$('msg').style.display = 'block';
refreshAll();
scheduleRotate();
setInterval(antiBurn, 10 * 60000);
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
</script>
