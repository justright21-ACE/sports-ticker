<!DOCTYPE html>

<head>

<!--
  SPORTS TICKER  -  powered by SportsBlaze (free, no API key)
  -------------------------------------------------------------

  QUICK SETTINGS: edit the CONFIG block below, OR add options to

-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #05070d;
    color: #f2f4f8;

  }
  #shift { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  /* ---------- header ---------- */

    border-bottom: 0.35vh solid #f5b800;
  }
  #brand {

  /* squarer screens: tighter header so name, tabs and clock never collide */

  .narrow #tabs { left: 27vw; right: 15vw; }
  .narrow .tab { font-size: 2.4vh; padding: 0 0.6vw; margin: 0 0.15vw; letter-spacing: 0.05vw; }
  .narrow #clock small { display: none; }

  #tabs { position: absolute; left: 0; right: 0; top: 0; text-align: center; line-height: 9vh; }
  .tab {
    display: inline-block; vertical-align: middle;

  .tab.on { background: #f5b800; color: #05070d; }
  .tab.empty { color: #2e3548; }
  /* lots of tabs: step the size down until they fit between the name and the clock */
  #tabs.s1 .tab { font-size: 2.7vh; padding: 0 0.6vw; margin: 0 0.12vw; letter-spacing: 0.04vw; }
  #tabs.s2 .tab { font-size: 2.4vh; padding: 0 0.5vw; margin: 0 0.1vw; letter-spacing: 0; }
  #tabs.s3 .tab { font-size: 2.1vh; padding: 0 0.4vw; margin: 0 0.08vw; letter-spacing: 0; }
  #tabs.s4 .tab { font-size: 1.8vh; padding: 0 0.3vw; margin: 0 0.05vw; letter-spacing: 0; height: 4vh; line-height: 4vh; }
  #tabs.s5 .tab { font-size: 1.5vh; padding: 0 0.25vw; margin: 0 0.04vw; letter-spacing: 0; height: 3.6vh; line-height: 3.6vh; }
  #clock {

    font-size: 4.6vh; font-weight: 600;

  /* ---------- main board ---------- */

  #cards { margin-top: 1vh; }

  .card {

    background: #1f2a44; border-radius: 0.7vh;

  /* team logo on a light disc, so dark logos still show on the dark cards */

  .logo img { position: absolute; left: 0.75vh; top: 0.75vh; width: 5.5vh; height: 5.5vh; }
  .logo.none { background: transparent; }

  .stripe { height: 0.9vh; }
  /* squarer screens (4:3, 5:4): drop the small team names so letters + scores have room */
  .narrow .name .nn { display: none; }
  .narrow .name { max-width: 9vw; }
  .narrow .name .rec { font-size: 2vh; }
  .narrow .score { font-size: 6vh; }
  .narrow .row .abbr { min-width: 6vw; font-size: 3.8vh; }
  .narrow .name .rec i { display: none; }
  .narrow .status .tag { font-size: 1.9vh; max-width: 45%; letter-spacing: 0.05vw; }
  .narrow .status .tag .tl { display: none; } .narrow .status .tag .ts { display: inline; }
  .narrow .abbr { min-width: 7vw; }
  .narrow .lines { font-size: 2.5vh; }
  .narrow .lines .lbl { font-size: 1.9vh; margin-right: 0.7vw; }              /* home team color across the top of the card */
  .name {
    display: inline-block; vertical-align: middle;
    max-width: 8.6vw; margin-left: 0.8vw;
    font-size: 3.1vh; color: #a5aec4; font-weight: 500;

  .rk { color: #f5b800; font-weight: 700; margin-right: 0.4vw; }
  .name .nn { display: block; overflow: hidden; text-overflow: ellipsis; }
  .name .rec { display: block; font-size: 2.3vh; line-height: 2.8vh; color: #7d8aa6; font-weight: 600; letter-spacing: 0.05vw; }
  .name .rec.ser { color: #f5b800; }
  .name .rec i { font-style: normal; }
  .name .rec .rkn { display: none; }
  .narrow .name .rec .rkn { display: inline; margin-right: 0.5vw; }
  .status { white-space: nowrap; overflow: hidden; }
  .t-bears .name .rec.ser { color: #E65C1E; } .t-usc .name .rec.ser { color: #FFC72C; }
  .t-usc .name .rec { color: #b8958f; }
  .status .tag { float: right; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
                 font-size: 2.2vh; letter-spacing: 0.12vw; color: #f5b800; font-weight: 700; }
  .status .tag b { font-weight: 700; } .status .tag .ts { display: none; }
  .t-bears .status .tag { color: #E65C1E; } .t-usc .status .tag { color: #FFC72C; }
  .score { position: absolute; right: 1.2vw; top: 0; font-size: 7.6vh; font-weight: 700; }
  .lose .score, .lose .abbr { color: #6f7a94; }
  .status {
    height: 5.6vh; line-height: 5.6vh; padding: 0 1.2vw;
    background: #0b1020; font-size: 3.5vh; font-weight: 600; letter-spacing: 0.1vw;
    color: #a5aec4; text-transform: uppercase;
  }
  .live .status { background: #3a0f14; color: #ffd5d5; }
  /* live vs final at a glance: live gets a red LIVE badge + glow; finished games are dimmed */
  .status .lvb { display: inline-block; background: #e23d3d; color: #ffffff; font-size: 2.4vh; font-weight: 700; letter-spacing: 0.15vw;
                 line-height: 3.4vh; padding: 0 0.6vw; border-radius: 0.5vh; margin-right: 0.8vw; vertical-align: 0.2vh; }
  .card.live { box-shadow: 0 0 0 0.3vh #e23d3d, 0 0 2.4vh rgba(226,61,61,0.45); }
  .card.done { opacity: 0.62; }

  .t-usc .status .lvb { background: #ffffff; color: #990000; }
  .t-usc .card.live { box-shadow: 0 0 0 0.3vh #ffffff, 0 0 2.4vh rgba(255,255,255,0.35); }
  .narrow .status .lvb { font-size: 1.9vh; line-height: 2.8vh; }
  .lines {
    height: 4.6vh; line-height: 4.6vh; padding: 0 1.2vw;
    border-top: 0.2vh solid #1b2338; white-space: nowrap; overflow: hidden;
    font-size: 3.1vh; font-weight: 600; color: #c9d0e0;
  }
  .lines .lbl { color: #f5b800; font-size: 2.5vh; letter-spacing: 0.15vw; margin-right: 0.9vw; }
  .lines .ou { float: right; }

  .fight .abbr { font-size: 3.4vh; max-width: 20vw; padding: 0 0.6vw; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }

  .dot {
    display: inline-block; width: 1.7vh; height: 1.7vh; border-radius: 50%;

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }

  #msg {

  /* ---------- bottom crawl ---------- */

    line-height: 9vh; font-size: 3.8vh; font-weight: 600;
  }
  #crawl .lg { color: #f5b800; margin: 0 1.2vw 0 3vw; font-weight: 700; }

  @-webkit-keyframes crawl { from { -webkit-transform: translateX(0); } to { -webkit-transform: translateX(-50%); } }
  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #foot {

  }
  #foot .r { float: right; }

  /* =========== COLLEGE TOP 25 SCREEN =========== */
  .rank { padding: 0 0.6vw; }
  .rkcol { float: left; width: 48.6%; }
  .rkcol + .rkcol { margin-left: 2.8%; }
  .rkrow { position: relative; height: 4.3vh; line-height: 4.3vh; padding: 0 0.8vw; border-bottom: 0.2vh solid #1b2338; white-space: nowrap; }
  .rkrow.rkh { height: 3.2vh; line-height: 3.2vh; font-size: 1.9vh; color: #7d8aa6; font-weight: 600; letter-spacing: 0.12vw; border-bottom-width: 0.3vh; }
  .rkrow.fav { background: rgba(245,184,0,0.14); }

  .rkrow .logo { width: 3.8vh; height: 3.8vh; margin-right: 0.7vw; }

  .rkvotes { clear: both; padding: 1vh 0.8vw 0 0.8vw; font-size: 2.3vh; line-height: 3vh; color: #c9d0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rkvotes b { color: #f5b800; font-size: 1.9vh; letter-spacing: 0.15vw; margin-right: 0.8vw; }
  .rkvotes i { font-style: normal; color: #7d8aa6; }
  .t-bears .rkvotes b { color: #E65C1E; } .t-usc .rkvotes b { color: #FFC72C; }
  .narrow .rkvotes { font-size: 1.9vh; }
  .rkh .rt { font-size: 1.9vh; }
  .rkrow .rkr { position: absolute; right: 0.8vw; top: 0; }
  .rkrow .rr { display: inline-block; width: 4.6vw; text-align: right; font-size: 2.5vh; color: #a5aec4; }
  .rkrow .mvt { display: inline-block; width: 4vw; text-align: right; font-size: 2.3vh; font-weight: 700; }
  .rkrow .mvt.up { color: #7bd88f; } .rkrow .mvt.dn { color: #ff6b6b; } .rkrow .mvt.eq { color: #4c5872; } .rkrow .mvt.nw { color: #f5b800; font-size: 1.9vh; }

  .narrow .rkh .cp, .narrow .rkh .rr, .narrow .rkh .mvt, .narrow .rkh .rt, .narrow .rkh .rn { font-size: 1.5vh; }

  /* =========== STANDINGS SCREENS (Mon-Fri) =========== */
  .stand { padding: 0 0.6vw; }

  .stbox { margin-bottom: 1.2vh; }

  /* =========== NFL PRIMETIME SCREEN (SNF / MNF / TNF) =========== */
  .tab.pt { border: 0.3vh solid #f5b800; color: #ffffff; }

  // Leagues to show, in this order.

  leagues: ['nfl', 'ncaaf', 'nba', 'nhl', 'mlb', 'wnba', 'ufc'],

  // Season change: starting on this date, WNBA comes off and men's college basketball

  seasonSwitch: { on: '2026-11-01', remove: 'wnba', add: 'ncaab', after: 'nba' },

  // Men's college basketball: 'top25' = games with a ranked team, 'all' = every Division I game

  cfb: 'top25',

  // Colors: 'auto' = Bears on Sunday-Friday, USC on Saturday.

  theme: 'auto',

  // Your teams, per league (team abbreviations). They get a highlighted border and go first.

  // doesn't also highlight the 76ers or Phillies.
  favorites: {

    nba:   ['SA', 'CHI'],    // Spurs, Bulls

  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';

  var d = new Date(s);

  for (i = 0; i < games.length; i++) {

    if (lines[keyOf(games[i])]) continue;

    if (cache.linesAt[ck] && now - cache.linesAt[ck] < ttl) return step();

      pages = pages.concat(standingsPages(lg));

  var head = '<div class="rkrow rkh"><span class="rn">' + (rk.mainLabel || 'AP') + '</span><span class="rt">TEAM</span><span class="rkr"><span class="rr">REC</span>' +
             '<span class="mvt">+/-</span>' + (rk.hasCoaches ? '<span class="cp">' + (rk.secLabel || 'COACHES') + '</span>' : '') + '</span></div>';
  for (var i = 0; i < rk.ap.length; i++) {
    var r = rk.ap[i], fav = inList(favs, String(r.team.abbreviation).toUpperCase());
    cols[i < half ? 0 : 1] += '<div class="rkrow' + (fav ? ' fav' : '') + '"><span class="rn">' + esc(r.rank) + '</span>' +
      logoHTML(r.team, lg) + '<span class="rt">' + esc(r.team.name) + '</span><span class="rkr"><span class="rr">' + esc(r.rec) + '</span>' +
      moveHTML(r, rk.firstWeek) + (rk.hasCoaches ? '<span class="cp">' + (r.cp ? esc(r.cp) : 'NR') + '</span>' : '') + '</span></div>';
  }
  var vt = '';
  for (var j = 0; j < (rk.votes || []).length; j++) {
    vt += (j ? ' &middot; ' : '') + esc(rk.votes[j].name) + (rk.votes[j].pts !== undefined ? ' <i>' + esc(rk.votes[j].pts) + '</i>' : '');
  }
  return '<div class="rank"><div class="rkcol">' + head + cols[0] + '</div><div class="rkcol">' + head + cols[1] + '</div>' +
    (vt ? '<div class="rkvotes"><b>' + (rk.votesLabel || 'ALSO RECEIVING VOTES') + '</b>' + vt + '</div>' : '') + '</div>';
}

function renderPage() {
  var pg = state.pages[state.pageIndex];
  if (!pg) {
    renderTabs('');
    $('heading').innerHTML = ''; $('cards').innerHTML = '';
    var m = $('msg'); m.style.display = 'block';
    if (state.lastOk) m.innerHTML = 'No games in the next 24 hours<small>Upcoming games and headlines keep scrolling below.</small>';
    return;
  }
  $('msg').style.display = 'none';
  $('heading').style.display = pg.pt ? 'none' : '';
  if (pg.rank) {
    var rk = rankingsFor(pg.lg);
    renderTabs(pg.lg);
    $('heading').innerHTML = '<span class="lg">' + (LEAGUE_NAMES[pg.lg] || pg.lg.toUpperCase()) + '</span><span class="sub">' +
      esc(rk.title + (rk.week ? ' · ' + rk.week : '')) + '</span>';
    $('cards').innerHTML = rankHTML(pg.lg, rk);
    return;
  }
  if (pg.stand) {
    renderTabs(pg.lg);
    $('heading').innerHTML = '<span class="lg">' + (LEAGUE_NAMES[pg.lg] || pg.lg.toUpperCase()) + '</span><span class="sub">Standings · ' + esc(pg.stand.title) + '</span>';
    try { $('cards').innerHTML = standHTML(pg.lg, pg.stand); fitStand(); } catch (err) { $('cards').innerHTML = ''; }
    return;
  }
  if (pg.pt) {
    renderTabs('pt:' + pg.kind[0]);
    $('heading').innerHTML = '';
    try {
      $('cards').innerHTML = pg.lg === 'mlb' ? wsHTML(pg.game, pg.kind) : ptHTML(pg.game, pg.kind, pg.lg);
    } catch (err) {                                      // never let this screen stop the ticker
      $('heading').style.display = '';
      $('cards').innerHTML = cardHTML(pg.game, pg.lg);
    }
    return;
  }
  renderTabs(pg.lg);
  var live = 0;
  for (var i = 0; i < pg.games.length; i++) if (pg.games[i].live) live++;
  var sub = pg.label + (live ? ' · ' + live + ' live' : '');
  $('heading').innerHTML = '<span class="lg">' + (LEAGUE_NAMES[pg.lg] || pg.lg.toUpperCase()) + '</span>' +
    '<span class="sub">' + esc(sub) + '</span>' +
    (pg.of > 1 ? '<span class="page">' + pg.num + ' / ' + pg.of + '</span>' : '');
  var html = '';
  for (var j = 0; j < pg.games.length; j++) html += cardHTML(pg.games[j], pg.lg);
  $('cards').innerHTML = html;
}

/* ---------- bottom bar ----------
   The bar plays one short segment at a time (one league, a few games), and the box on the
   left names what's scrolling. Short segments keep each pass quick and stay within what
   older TV browsers can draw. */
function crawlRelevant(e, lg, today) {
  if (e.live || isFav(e, lg)) return true;                  // live games + your teams, any day
  return ymd(parseDate(e.date)) === today;                  // otherwise just today's games
}
function crawlGameHTML(e, lg, sx) {
  var a = e.teams.away, h = e.teams.home, sa = scoreOf(e, 'away'), sh = scoreOf(e, 'home');
  if (e.ufc) {
    var w = e.winner === 'away' ? a : (e.winner === 'home' ? h : null), l = w === a ? h : a;
    var txt = isFinal(e) && w ? esc(w.abbreviation) + ' def. ' + esc(l.abbreviation) : esc(a.abbreviation) + ' vs ' + esc(h.abbreviation);
    return '<span class="g">' + txt + '<span class="st' + (e.live ? ' lv' : '') + '">' + esc(statusText(e, lg)) + '</span></span>';
  }
  var st = statusText(e, lg);
  var ra = apRank(a, lg), rh = apRank(h, lg);
  var an = (ra ? '#' + ra + ' ' : '') + a.abbreviation, hn = (rh ? '#' + rh + ' ' : '') + h.abbreviation;
  var body = sa !== '' ? esc(an) + ' ' + esc(sa) + '  ' + esc(hn) + ' ' + esc(sh)
                       : esc(an) + ' @ ' + esc(hn);
  var ln = '';
  if (e.open && !e.live && !isFinal(e)) {
    var bb = bet(e, lg);
    ln = bb.sp + (bb.tot ? (bb.sp ? '  ' : '') + 'O/U ' + bb.tot : '');
  }
  return '<span class="g">' + body + '<span class="st' + (e.live ? ' lv' : '') + '">' + esc(st) + '</span>' +
         (ln ? '<span class="st">  ' + esc(ln) + '</span>' : '') +
         (sx ? '<span class="sx">' + esc(sx) + '</span>' : '') + '</span>';
}
function renderCrawl() {
  var groups = [], today = ymd(new Date());
  for (var i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i], d = state.data[lg];
    if (!d || !d.games.length || seasonOver(lg)) continue;
    var all = sortGames(d.games.slice(0), lg), games = [], segs = [];
    for (var j = 0; j < all.length; j++) if (crawlRelevant(all[j], lg, today)) games.push(all[j]);
    games = games.slice(0, CONFIG.crawlMaxPerLeague);
    var name = LEAGUE_NAMES[lg] || lg.toUpperCase();
    for (var k = 0; k < games.length; k += CONFIG.crawlPerSegment) {
      var html = '';
      for (var m = k; m < k + CONFIG.crawlPerSegment && m < games.length; m++) {
        var e = games[m], sx = '';
        if (CONFIG.crawlStats) {
          if (isFav(e, lg) && (e.live || isFinal(e))) sx = e.extra;   // your teams: full stats
          else if (e.live) sx = e.sit;                                // others: just ball + down
        }
        html += crawlGameHTML(e, lg, sx);
      }
      segs.push({ label: name, html: html });
    }
    if (segs.length) groups.push(segs);
  }
  if (CONFIG.crawlNews && news.items.length) {
    var ns = [];
    for (var n = 0; n < news.items.length; n += 3) {
      var nh = '';
      for (var q = n; q < n + 3 && q < news.items.length; q++) {
        var it = news.items[q];
        nh += '<span class="n"><span class="nl">' + (LEAGUE_NAMES[it.lg] || it.lg.toUpperCase()) + '</span>' + esc(it.h) + '</span>';
      }
      ns.push({ label: 'HEADLINES', html: nh });
    }
    groups.push(ns);
  }
  // take turns: first segment of each league, then the second of each, and so on
  var out = [], more = true;
  for (var r = 0; more; r++) {
    more = false;
    for (var g = 0; g < groups.length; g++) if (groups[g][r]) { out.push(groups[g][r]); more = true; }
  }
  state.crawlSegs = out;                           // picked up when the current segment finishes
  if (!state.crawlRunning) playSegment(0);
}
function setX(el, x, secs) {
  el.style.webkitTransition = secs ? '-webkit-transform ' + secs + 's linear' : 'none';
  el.style.transition = secs ? 'transform ' + secs + 's linear' : 'none';
  el.style.webkitTransform = 'translateX(' + x + 'px)';
  el.style.transform = 'translateX(' + x + 'px)';
}
function playSegment(i) {
  var segs = state.crawlSegs || [], el = $('crawl');
  if (state.crawlTimer) { clearTimeout(state.crawlTimer); state.crawlTimer = null; }
  if (!segs.length) {
    el.innerHTML = ''; $('crawllabel').innerHTML = 'SCORES'; state.crawlRunning = false; return;
  }
  i = i % segs.length;
  state.crawlIdx = i;
  var seg = segs[i];
  $('crawllabel').innerHTML = esc(seg.label);
  el.innerHTML = seg.html;
  var start = $('crawlbar').offsetWidth, w = el.offsetWidth;
  var secs = Math.max(4, Math.round((start + w) / CONFIG.crawlSpeed));
  setX(el, start, 0);                              // park just off the right edge
  void el.offsetWidth;
  setX(el, -w, secs);                              // scroll until fully off the left edge
  state.crawlRunning = true;
  state.crawlTimer = setTimeout(function () { playSegment(state.crawlIdx + 1); }, secs * 1000 + 300);
}

/* Saturday = USC, every other day = Bears (unless a theme is forced) */
function applyTheme(d) {
  var t = CONFIG.theme;

  var cls = t === 'classic' ? '' : 't-' + t;
  var vw = window.innerWidth || document.documentElement.clientWidth, vh = window.innerHeight || document.documentElement.clientHeight;
  if (vh && vw / vh < 1.7) cls += (cls ? ' ' : '') + 'narrow';     // 16:10 and squarer
  if (document.body.className !== cls) document.body.className = cls;
}

/* ---------- main loop ---------- */
/* Swap leagues when the season-change date arrives (checked on every refresh). */
function applySeasonSwitch() {
  var s = CONFIG.seasonSwitch;
  if (!s || ymd(new Date()) < s.on) return;
  var out = [], i, added = inList(CONFIG.leagues, s.add);
  for (i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i];
    if (lg === s.remove) continue;
    out.push(lg);
    if (lg === s.after && !added) { out.push(s.add); added = true; }
  }
  if (!added) out.push(s.add);
  CONFIG.leagues = out;
  delete state.data[s.remove];
  CONFIG.seasonSwitch = null;                      // done
}

function refreshAll() {
  applySeasonSwitch();
  var i = 0, errs = 0, anyLive = false;
  function next() {
    if (i >= CONFIG.leagues.length) return finished();
    var lg = CONFIG.leagues[i++];
    loadLeague(lg, function (err, res) {
      if (err) { errs++; return next(); }        // keep the last good data on screen
      fetchLines(lg, res.games, function () {
        for (var k = 0; k < res.games.length; k++) {
          res.games[k].open = lines[keyOf(res.games[k])] || null;
          var ex = extras[keyOf(res.games[k])] || {};
          res.games[k].extra = ex.all || '';
          res.games[k].sit = ex.sit || '';
          if (res.games[k].live) anyLive = true;
        }
        state.data[lg] = res;
        checkChampion(lg);
        next();
      });
    });
  }
  function finished() {
    saveLines();
    if (errs < CONFIG.leagues.length) { state.lastOk = new Date(); state.failures = 0; }
    else state.failures++;
    if (!state.lastOk && state.failures) {
      var m = $('msg'); m.style.display = 'block';
      m.innerHTML = 'Can&rsquo;t reach SportsBlaze<small>Check that this screen is connected to the internet. ' +
        'Retrying automatically&hellip;</small>';
    }
    var wait = state.failures ? 30 : (anyLive ? CONFIG.refreshLiveSec : CONFIG.refreshIdleSec);
    loadTeams(function () { loadNews(function () { loadPtDetails(function () { loadRankings(function () { loadStandings(function () {
      buildPages(); renderPage(); renderCrawl(); renderFoot(errs);
      setTimeout(refreshAll, wait * 1000);
    }); }); }); }); });
  }
  next();
}

function rotate() {
  if (state.pages.length > 1) { state.pageIndex = (state.pageIndex + 1) % state.pages.length; renderPage(); }
  scheduleRotate();
}
function scheduleRotate() {                              // each screen can have its own hold time
  if (state.rotTimer) clearTimeout(state.rotTimer);
  var pg = state.pages[state.pageIndex];
  state.rotTimer = setTimeout(rotate, ((pg && pg.hold) || CONFIG.rotateSec) * 1000);
}

/* nudge everything a few pixels every 10 min to protect older screens from burn-in */
function antiBurn() {
  var s = $('shift');
  s.style.top = Math.round(Math.random() * 4 - 2) + 'px';
  s.style.left = Math.round(Math.random() * 4 - 2) + 'px';
}

/* ---------- fit any screen ----------
   The layout is built for sideways screens from 5:4 up to 21:9. On anything outside that
   (a phone or tablet held upright, a super-wide monitor), or when the edges need a safety
   margin (rounded corners, a notch, a TV that crops its edges: ?inset=3 = 3% each side),
   the ticker runs inside a frame of the right shape, centered with dark bars around it. */
var FIT = { min: 1.25, max: 2.4 };
function screenInsets() {
  var o = { t: 0, r: 0, b: 0, l: 0 }, m = window.location.search.match(/[?&]inset=([\d.]+)/);
  var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
  try {                                                  // phones/tablets with rounded corners or a notch report their safe area
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
                      'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)';
    document.body.appendChild(d);
    var cs = window.getComputedStyle(d);
    o = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    document.body.removeChild(d);
  } catch (e) {}
  if (m && +m[1] > 0) {
    var px = Math.min(+m[1], 15) / 100;
    o.t = Math.max(o.t, H * px); o.b = Math.max(o.b, H * px); o.l = Math.max(o.l, W * px); o.r = Math.max(o.r, W * px);
  }
  return o;
}
function needsFrame() {
  var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
  if (!W || !H) return false;
  var ins = screenInsets(), a = W / H;
  return a < FIT.min - 0.02 || a > FIT.max + 0.02 || ins.t + ins.r + ins.b + ins.l > 0;
}
var FRAMED = /[?&]framed=1/.test(window.location.search);
function buildFrame() {
  document.body.className = '';
  document.body.style.background = '#000';
  document.body.innerHTML = '';
  var f = document.createElement('iframe'), url = window.location.href.replace(/#.*$/, '');
  f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'framed=1';
  f.setAttribute('frameborder', '0'); f.setAttribute('scrolling', 'no');
  f.style.cssText = 'position:absolute;border:0;margin:0;padding:0;background:#05070d;overflow:hidden';
  document.body.appendChild(f);
  function place() {
    var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
    var ins = screenInsets(), aw = W - ins.l - ins.r, ah = H - ins.t - ins.b, w = aw, h = ah;
    if (aw / ah < FIT.min) h = Math.floor(aw / FIT.min); else if (aw / ah > FIT.max) w = Math.floor(ah * FIT.max);
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.style.left = Math.round(ins.l + (aw - w) / 2) + 'px'; f.style.top = Math.round(ins.t + (ah - h) / 2) + 'px';
  }
  place();
  window.addEventListener('resize', place);
  window.addEventListener('orientationchange', function () { setTimeout(place, 300); });
  setTimeout(function () { window.location.reload(); }, 6 * 3600000);   // same fresh start every 6 hours
}
var OUTER = !FRAMED && needsFrame();
if (!FRAMED) window.addEventListener('resize', function () {   // turned the screen or resized the window
  if (!OUTER && needsFrame()) window.location.reload();
});

/* ---------- start ---------- */
if (OUTER) buildFrame(); else {
readParams();
renderClock(); setInterval(renderClock, 10000);
$('msg').style.display = 'block';
refreshAll();
scheduleRotate();
setInterval(antiBurn, 10 * 60000);
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
}
</script>
