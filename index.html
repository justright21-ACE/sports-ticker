<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The FanCave Wire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap">
<!--
  SPORTS TICKER  -  powered by SportsBlaze (free, no API key)
  -------------------------------------------------------------
  Written in old-style JavaScript (no fetch, no arrow functions)
  so it runs on older TV / monitor web browsers and a Chromecast.

  QUICK SETTINGS: edit the CONFIG block below, OR add options to
  the page address, for example:
     index.html?leagues=nfl,nba&fav=DAL,SA
     index.html?demo=1           (fake games, to test the layout)
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* the page is one fixed, clipped frame the size of the screen: animations that fly past the edges (the touchdown helmets,
     big plays, celebrations) can't make it wider, which the TV's browser would answer by zooming the whole page out */
  body { position: fixed; left: 0; top: 0; right: 0; bottom: 0; width: 100%; }
  body {
    background: #05070d;
    color: #f2f4f8;
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shift { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  /* ---------- header ---------- */
  #top {
    position: absolute; top: 0; left: 0; right: 0;
    height: 9vh;
    background: #0b1020;
    border-bottom: 0.35vh solid #f5b800;
  }
  #brand {
    position: absolute; left: 2.5vw; top: 0; line-height: 9vh;
    font-size: 4.2vh; font-weight: 700; letter-spacing: 0.15vw;
    text-transform: uppercase;
  }
  #brand span { color: #f5b800; }
  #brand small { font-size: 2.2vh; letter-spacing: 0.2vw; margin-right: 0.5vw; color: #a5aec4; vertical-align: 0.3vh; }
  .t-usc #brand small { color: #FFE2B6; }
  /* squarer screens: tighter header so name, tabs and clock never collide */
  .narrow #brand { font-size: 3vh; letter-spacing: 0.05vw; left: 2vw; }
  .narrow #brand small { font-size: 1.7vh; letter-spacing: 0.1vw; }
  .narrow #tabs { left: 27vw; right: 15vw; }
  .narrow .tab { font-size: 2.4vh; padding: 0 0.6vw; margin: 0 0.15vw; letter-spacing: 0.05vw; }
  .narrow #clock small { display: none; }
  .narrow #clock { font-size: 3.8vh; right: 2vw; }
  #tabs { position: absolute; left: 0; right: 0; top: 0; text-align: center; line-height: 9vh; }
  .tab {
    display: inline-block; vertical-align: middle;
    margin: 0 0.2vw; padding: 0 0.8vw;
    height: 5vh; line-height: 5vh;
    font-size: 3vh; font-weight: 600; letter-spacing: 0.08vw;
    color: #6f7a94; border-radius: 0.6vh;
  }
  .tab.on { background: #f5b800; color: #05070d; }
  .tab.bdg { height: 8.4vh; line-height: 8.4vh; padding: 0 0.2vw; position: relative; }
  .tab.bdg img { height: 8vh; vertical-align: middle; opacity: 0.5; -webkit-filter: grayscale(0.5); filter: grayscale(0.5); }
  #tabs .tab.bdg, #tabs .tab.bdg.on { background: transparent !important; box-shadow: none !important; border-color: transparent !important; }
  .tab.bdg.on img { opacity: 1; -webkit-filter: drop-shadow(0 0 0.8vh rgba(245,184,0,0.75)); filter: drop-shadow(0 0 0.8vh rgba(245,184,0,0.75)); }
  .tab.bdg i { position: absolute; left: 0; top: 0.8vh; margin: 0; }
  #tabs.s4 .tab.bdg, #tabs.s5 .tab.bdg { height: 6vh; line-height: 6vh; } #tabs.s4 .tab.bdg img, #tabs.s5 .tab.bdg img { height: 5.6vh; }
  .tab.empty { color: #2e3548; }
  /* lots of tabs: step the size down until they fit between the name and the clock */
  #tabs .tab.tout { -webkit-animation: tabOut 0.45s ease-in both; animation: tabOut 0.45s ease-in both; }
  #tabs .tab.tback { -webkit-animation: tabBack 0.6s ease-out both; animation: tabBack 0.6s ease-out both; }
  @-webkit-keyframes tabOut { to { opacity: 0; -webkit-transform: translateY(-3vh) scale(0.8); } } @keyframes tabOut { to { opacity: 0; transform: translateY(-3vh) scale(0.8); } }
  @-webkit-keyframes tabBack { from { opacity: 0; -webkit-transform: translateX(4vw); } to { opacity: 1; -webkit-transform: none; } } @keyframes tabBack { from { opacity: 0; transform: translateX(4vw); } to { opacity: 1; transform: none; } }
  #tabs.s1 .tab { font-size: 2.7vh; padding: 0 0.6vw; margin: 0 0.12vw; letter-spacing: 0.04vw; }
  #tabs.s2 .tab { font-size: 2.4vh; padding: 0 0.5vw; margin: 0 0.1vw; letter-spacing: 0; }
  #tabs.s3 .tab { font-size: 2.1vh; padding: 0 0.4vw; margin: 0 0.08vw; letter-spacing: 0; }
  #tabs.s4 .tab { font-size: 1.8vh; padding: 0 0.3vw; margin: 0 0.05vw; letter-spacing: 0; height: 4vh; line-height: 4vh; }
  #tabs.s5 .tab { font-size: 1.5vh; padding: 0 0.25vw; margin: 0 0.04vw; letter-spacing: 0; height: 3.6vh; line-height: 3.6vh; }
  #clock {
    position: absolute; right: 2.5vw; top: 0; line-height: 9vh; text-align: right;
    font-size: 4.6vh; font-weight: 600;
  }
  #clock small { font-size: 2.6vh; color: #9BA3B8; margin-right: 1vw; font-weight: 500; }

  /* ---------- main board ---------- */
  #board { position: absolute; top: 9vh; left: 0; right: 0; bottom: 13vh; padding: 1.6vh 1.6vw 0 1.6vw; }
  #heading { height: 6vh; line-height: 6vh; padding: 0 0.6vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* one line, never into the cards */
  #heading .lg { font-size: 5vh; font-weight: 700; letter-spacing: 0.2vw; }

  #heading .page { float: right; font-size: 2.6vh; color: #6f7a94; }

  .card {

  .fwrap { display: inline-block; position: relative; vertical-align: middle; margin-right: 0.7vw; }

  .lose .fwrap { opacity: 0.55; }
  .lose .logo { opacity: 0.55; }
  .stripe { height: 0.9vh; }
  /* squarer screens (4:3, 5:4): drop the small team names so letters + scores have room */
  .narrow .name .nn { display: none; }
  .narrow .name { max-width: 9vw; }
  .narrow .name .rec { font-size: 2vh; }
  .narrow .score { font-size: 6vh; }
  .narrow .row .abbr { min-width: 6vw; font-size: 3.8vh; }
  .narrow .name .rec i { display: none; }
  .narrow .status .tag { font-size: 1.9vh; max-width: 45%; letter-spacing: 0.05vw; }
  .narrow .status .tag .tl { display: none; } .narrow .status .tag .ts { display: inline; }
  .narrow .abbr { min-width: 7vw; }
  .narrow .lines { font-size: 2.5vh; }
  .narrow .lines .lbl { font-size: 1.9vh; margin-right: 0.7vw; }              /* home team color across the top of the card */
  .name {
    display: inline-block; vertical-align: middle;
    max-width: 8.6vw; margin-left: 0.8vw;
    font-size: 3.1vh; color: #a5aec4; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 3.8vh;
  }
  .rk { color: #f5b800; font-weight: 700; margin-right: 0.4vw; }
  .name .nn { display: block; overflow: hidden; text-overflow: ellipsis; }
  .name .rec { display: block; font-size: 2.3vh; line-height: 2.8vh; color: #9FA9BD; font-weight: 600; letter-spacing: 0.05vw; }
  .name .rec.ser { color: #f5b800; }
  .name .rec i { font-style: normal; }
  .name .rec .rkn { display: none; }
  .narrow .name .rec .rkn { display: inline; margin-right: 0.5vw; }
  .status { white-space: nowrap; overflow: hidden; }
  .t-bears .name .rec.ser { color: #FF8C3A; } .t-usc .name .rec.ser { color: #FFC72C; }
  .t-usc .name .rec { color: #b8958f; }
  .status .tag { float: right; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
                 font-size: 2.2vh; letter-spacing: 0.12vw; color: #f5b800; font-weight: 700; }
  .status .tag b { font-weight: 700; } .status .tag .ts { display: none; }
  .live .status .tag { max-width: 40%; } .narrow .live .status .tag { display: none; }   /* squarer screens: no room beside the clock */ .live .status .tag .tl { display: none; } .live .status .tag .ts { display: inline; }   /* live: the clock needs the room */
  .t-bears .status .tag { color: #FF8C3A; } .t-usc .status .tag { color: #FFC72C; }
  .score { position: absolute; right: 1.2vw; top: 0; font-size: 7.6vh; font-weight: 700; }
  .lose .score, .lose .abbr { color: #6f7a94; }
  .status {

    background: #0b1020; font-size: 3.5vh; font-weight: 600; letter-spacing: 0.1vw;
    color: #a5aec4; text-transform: uppercase;
  }
  .live .status { background: #3a0f14; color: #ffd5d5; }

  .status .lvb { display: inline-block; background: #e23d3d; color: #ffffff; font-size: 2.4vh; font-weight: 700; letter-spacing: 0.15vw;

  .card.live { box-shadow: 0 0 0 0.3vh #e23d3d, 0 0 2.4vh rgba(226,61,61,0.45); }

  .card.done .status { color: #9BA3B8; }
  .t-usc .status .lvb { background: #ffffff; color: #990000; }
  .t-usc .card.live { box-shadow: 0 0 0 0.3vh #ffffff, 0 0 2.4vh rgba(255,255,255,0.35); }
  .narrow .status .lvb { font-size: 1.9vh; line-height: 2.8vh; }
  .lines {

  }

  .lines .ou { float: right; }
  .lines .flbl { display: inline-block; max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .lines .flbl.short { max-width: 58%; }

  .lines .lf { display: none; }
  .lines .lf.on { display: inline; }
  .lines .mv { color: #9FA9BD; font-size: 2.2vh; font-weight: 500; margin-left: 0.5vw; }

  /* WWE premium live event card: the event's name on top, the venue under it */

  .showbox .sv { margin-top: 1.2vh; font-size: 2.6vh; color: #a5aec4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-bears .fight .score { color: #FF8C3A; }
  .t-usc .fight .score { color: #FFC72C; }
  .dot {
    display: inline-block; width: 1.7vh; height: 1.7vh; border-radius: 50%;
    background: #ff4545; margin-right: 0.7vw; vertical-align: middle; position: relative; top: -0.2vh;
    -webkit-animation: pulse 1.6s infinite; animation: pulse 1.6s infinite;
  }
  @-webkit-keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }

  #hl { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 70; display: none; background: #000; }
  #hl.loading { opacity: 0; }
  #hl { -webkit-transition: opacity 0.4s; transition: opacity 0.4s; }

  #hl .hlbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4vh 2vw; background: rgba(8,12,24,0.85);
               border-top: 0.3vh solid #f5b800; color: #f2f4f8; font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hl .hlbar b { color: #f5b800; letter-spacing: 0.15vw; margin-right: 1vw; }

  #hlstat { position: fixed; right: 1vw; top: 12vh; z-index: 80; max-width: 46vw; padding: 0.8vh 1vw; border-radius: 0.6vh;
            background: rgba(10,16,30,0.92); border: 0.15vh solid #f5b800; color: #f2f4f8; font-size: 1.9vh; line-height: 2.6vh; }
  #hlstat b { color: #f5b800; margin-right: 0.5vw; }

             background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,0.85) 45%); background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.85) 45%); }
  #hlcard { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; background: #0a1020; overflow: hidden; }

  #hlcard .hcbody { position: absolute; left: 4vw; right: 4vw; bottom: 5vh; color: #f2f4f8; }

/* ---------- networking (XMLHttpRequest works everywhere) ---------- */
function getJSON(url, cb) {
  var done = false;
  function finish(err, data) { if (!done) { done = true; cb(err, data); } }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    try { x.timeout = 20000; } catch (t) {}
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var data = null;
        try { data = JSON.parse(x.responseText); } catch (e) { return finish('bad data'); }
        finish(null, data);
      } else {
        finish('HTTP ' + x.status);
      }
    };
    x.ontimeout = function () { finish('timeout'); };
    x.onerror = function () { finish('network'); };
    x.send();
  } catch (e) { finish('network'); }
}

function bracketRegionHTML(rg) {

  }
  function ffGame(rg) { for (var k = 0; k < ff.length; k++) if (teamIn(ff[k], rg)) return ff[k]; return null; }

      if (x.readyState !== 4 || x.status < 200 || x.status >= 300 || !/FanCave/.test(x.responseText || '')) return;
      var h = textHash(x.responseText), now = new Date().getTime();
      if (!ver.base) { ver.base = h; return; }
      if (h !== ver.base) {
        if (h === ver.next) ver.seen++; else { ver.next = h; ver.seen = 1; }
        if (ver.seen >= 2) ver.want = 'new';
      } else { ver.next = ''; ver.seen = 0; }
      var healAt = 0; try { healAt = +window.localStorage.getItem('fcw_heal') || 0; } catch (e) {}
      if (!ver.want && isStale(now) && (state.lastOk ? now - state.lastOk.getTime() : now - PAGE_START) > 15 * 60000 && now - healAt > 30 * 60000) {
        try { window.localStorage.setItem('fcw_heal', String(now)); } catch (e) {}
        ver.want = 'stuck';
      }
    };
    x.send();
  } catch (e) {}
}
function reloadNow() {
  var u = window.location.href.replace(/#.*$/, '').replace(/([?&])v=[^&]*&?/, '$1').replace(/[?&]$/, '');
  window.location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + (ver.next || ver.base || new Date().getTime()));
}
function reloadIfWanted() {
  if (!ver.want || hl.playing || bnews.on) return false;
  if (state.animUntil && new Date().getTime() < state.animUntil) return false;
  reloadNow();
  return true;
}

/* =================== BREAKING NEWS (your teams) ===================
   ESPN's news for each of your teams, every 10 minutes. A story from the last few hours about a trade,
   signing, release, big injury, suspension or a coach fired / hired slides a BREAKING banner over the
   top of the screen for CONFIG.breakingSec seconds, once per story (remembered across reloads). */
var NEWS_TEAMS = [['nfl', 'football/nfl', '3', 'Bears', '#0B162A', '#C83803'], ['nfl', 'football/nfl', '21', 'Eagles', '#004C54', '#A5ACAF'],
                  ['ncaaf', 'football/college-football', '30', 'USC', '#990000', '#FFC72C'], ['ncaaf', 'football/college-football', '275', 'Wisconsin', '#C5050C', '#FFFFFF'],
                  ['nba', 'basketball/nba', '4', 'Bulls', '#CE1141', '#000000'], ['nba', 'basketball/nba', '24', 'Spurs', '#000000', '#C4CED4'],
                  ['mlb', 'baseball/mlb', '4', 'White Sox', '#27251F', '#C4CED4'], ['nhl', 'hockey/nhl', '4', 'Blackhawks', '#CF0A2C', '#FFD100']];
var BREAK_RE = /\b(trade[sd]?|trading|acquir(e|es|ed|ing)|deal(s)? (for|with|to)|signed|signings?\b|\bsigns? (?!of\b|that\b|point\b|are\b|were\b|the times\b)|agree(s|d)? to|extension|re-?sign|contract|releas(e|es|ed)|waive[sd]?|cut[s]?\b|claim(s|ed)? off|fire[sd]?|dismiss(es|ed)?|part(s|ed)? ways|hire[sd]?|hiring|names? .{0,40}(coach|coordinator|manager|president|general manager|gm)\b|interim|resign(s|ed)?|retire[sd]?|out for (the )?season|season-ending|torn|tears (his|her|an?)\b|ACL|Achilles|surgery|injured reserve|placed on (the )?IR|suspend(s|ed)?|suspension|transfer(s|ring)?|commit(s|ted)?|decommit|declares?|enter(s|ing)? (the )?(transfer portal|draft))/i;
var BREAK_SKIP = /fantasy|odds|betting|prediction|pick'?em|power rankings?|takeaways|grades?|mock draft|what we learned|best bets|\bDFS\b|preview|podcast|watch:|by the numbers|ranking the|injury report|depth chart|schedule release|uniforms?\b|tickets?\b/i;
var bnews = { at: 0, queue: [], on: false, seen: {}, primed: false, timer: 0 }, BNEWS_KEY = 'fcw_brk';
try { var bk0 = JSON.parse(window.localStorage.getItem(BNEWS_KEY)); if (bk0 && typeof bk0 === 'object') { bnews.seen = bk0; bnews.primed = true; } } catch (e) {}
function bnewsSave() {
  var now = new Date().getTime(), keep = {};
  for (var k in bnews.seen) if (now - bnews.seen[k] < 4 * 86400000) keep[k] = bnews.seen[k];
  bnews.seen = keep;
  try { window.localStorage.setItem(BNEWS_KEY, JSON.stringify(keep)); } catch (e) {}
}
function breakingOf(a, T) {
  var hd = String(a.headline || ''), ty = String(a.type || '');
  if (!hd || /^(Media|Recap|Preview|Video)$/i.test(ty) || BREAK_SKIP.test(hd) || !BREAK_RE.test(hd)) return null;
  var cats = a.categories || [], teamCats = 0, mine = false;
  for (var i = 0; i < cats.length; i++) {
    var tid = cats[i].teamId || (cats[i].team && cats[i].team.id);
    if (cats[i].type === 'team' || tid) { teamCats++; if (String(tid) === T[2]) mine = true; }
  }
  if (teamCats && !mine) return null;                                // about another team
  var pub = parseDate(a.published || a.lastModified || '').getTime();
  if (!pub || new Date().getTime() - pub > CONFIG.breakingMaxHrs * 3600000) return null;
  return { id: String(a.id || a.dataSourceIdentifier || hd), h: hd, team: T, at: pub };
}
function loadBreaking(cb) {
  var now = new Date().getTime();
  if (DEMO || !CONFIG.breaking || now - bnews.at < 10 * 60000) return cb();
  bnews.at = now;
  var k = 0, found = [], any = false;
  (function next() {
    if (k >= NEWS_TEAMS.length) {
      found.sort(function (x, y) { return x.at - y.at; });
      for (var f = 0; f < found.length; f++) {
        if (bnews.seen[found[f].id]) continue;
        bnews.seen[found[f].id] = now;
        if (bnews.primed) bnews.queue.push(found[f]);                       // no memory of what was shown: don't replay old news
      }
      if (any) { bnews.primed = true; bnewsSave(); }
      breakingNext();
      return cb();
    }
    var T = NEWS_TEAMS[k++];
    if (!inList(CONFIG.leagues, T[0])) return next();
    getJSON(ESPN_API + T[1] + '/news?team=' + T[2], function (err, data) {
      var arts = (!err && data && data.articles) || [];
      if (!err) any = true;
      for (var j = 0; j < arts.length; j++) { var b = breakingOf(arts[j], T); if (b) found.push(b); }
      next();
    });
  })();
}
function breakingNext() {
  if (bnews.on || !bnews.queue.length || hl.playing) return;
  var b = bnews.queue.shift(), T = b.team, el = $('breaking');
  if (!el) return;
  el.style.borderColor = T[5] === '#FFFFFF' || T[5] === '#C4CED4' || T[5] === '#A5ACAF' ? T[4] : T[5];
  el.innerHTML = '<div class="bl" style="background:' + T[4] + '"><span class="bk">BREAKING</span><b>' + esc(T[3].toUpperCase()) + '</b>' +
    '<i style="color:' + T[5] + '">' + esc(timeStr(new Date(b.at))) + '</i></div><div class="bh"><span>' + esc(b.h) + '</span></div>';
  el.style.display = 'none'; void el.offsetWidth; el.style.display = 'block';    // replay the slide-in
  bnews.on = true;
  clearTimeout(bnews.timer);
  bnews.timer = setTimeout(function () {
    el.style.display = 'none'; bnews.on = false;
    bnews.timer = setTimeout(breakingNext, 1500);                          // the next story, if several came in
  }, CONFIG.breakingSec * 1000);
}

/* ---------- start ---------- */
if (OUTER) buildFrame(); else {
readParams();
renderClock(); setInterval(renderClock, 10000);
$('msg').style.display = 'block';
/* sound: any click, tap or key (a TV remote's OK) on the page turns it on */
if (CONFIG.highlights) {                                         // one tap / click / key lets highlight clips play
  var hlEv = ['click', 'keydown', 'touchstart', 'mousedown'];
  for (var hli = 0; hli < hlEv.length; hli++) document.addEventListener(hlEv[hli], hlUnlock, true);
}
if (CONFIG.sound) {
  var sndEv = ['click', 'keydown', 'touchstart', 'mousedown'];
  for (var sni = 0; sni < sndEv.length; sni++) document.addEventListener(sndEv[sni], soundUnlock, true);
  soundNote();
}
snapLoad();                                                     // the last scores right away, while the fresh ones load
refreshAll();
scheduleRotate();
setInterval(antiBurn, 10 * 60000);
setInterval(staleCheck, 15000);
if (CONFIG.tdTest) setTimeout(function () {                      // ?tdtest=CHI (or ncaaf:USC): show the touchdown run once
  var pr = CONFIG.tdTest.split(':'), lg = pr.length > 1 ? pr[0].toLowerCase() : 'nfl', ab = pr[pr.length - 1], t = null, L = [];
  for (var k in state.data) L = L.concat(state.data[k] && state.data[k].games ? state.data[k].games : []);
  for (var i = 0; i < L.length && !t; i++) { if (L[i].teams.away.abbreviation === ab) t = L[i].teams.away; else if (L[i].teams.home.abbreviation === ab) t = L[i].teams.home; }
  tdRun(t || { abbreviation: ab, name: ab, short: ab }, lg, null, null);
}, 6000);
verCheck(); setInterval(verCheck, 5 * 60000);
if (CONFIG.fastRefreshSec) setInterval(fastRefresh, CONFIG.fastRefreshSec * 1000);   // Bears / USC live: every 10 s
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
}
