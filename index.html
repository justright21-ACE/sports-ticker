<style>

  .card {

  .status { white-space: nowrap; overflow: hidden; }

  .t-usc .name .rec { color: #b8958f; }
  .status .tag { float: right; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;

  .status {

  }

                 line-height: 3.4vh; padding: 0 0.6vw; border-radius: 0.5vh; margin-right: 0.8vw; vertical-align: 0.2vh; }

  .lines {

  .showbox .sv { margin-top: 1.2vh; font-size: 2.6vh; color: #a5aec4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .t-usc .fight .score { color: #FFC72C; }
  .dot {

    -webkit-animation: pulse 1.6s infinite; animation: pulse 1.6s infinite;
  }
  @-webkit-keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }

  #msg {

  }

  /* ---------- bottom crawl ---------- */
  #crawlbar {

    background: #0b1020; border-top: 0.35vh solid #f5b800; overflow: hidden;
  }
  /* league logo on a light disc (so dark logos show) in the bottom bar's label and next to each headline */
  .llg { display: inline-block; vertical-align: middle; position: relative; width: 6.2vh; height: 6.2vh; margin: -0.6vh 1vw 0 -0.4vw; border-radius: 50%; background: #f2f4f8; }
  .llg img, .llg svg { position: absolute; left: 0.7vh; top: 0.7vh; width: 4.8vh; height: 4.8vh; }
  .llg.sm { width: 4.6vh; height: 4.6vh; margin: -0.5vh 0.6vw 0 0; } .llg.sm img, .llg.sm svg { left: 0.5vh; top: 0.5vh; width: 3.6vh; height: 3.6vh; }
  .lalt { display: none; }
  /* league logos in the top tabs */
  .tab.lgo { padding: 0 0.45vw; }

  .tab .tl.coll { width: 4.8vh; border-radius: 0.6vh; } .tab .tl.coll img { left: 0.1vh; top: 0; width: 4.3vh; height: 4.3vh; }

  #tabs.s4 .tab .tl img, #tabs.s4 .tab .tl svg, #tabs.s5 .tab .tl img, #tabs.s5 .tab .tl svg { left: 0.35vh; top: 0.35vh; width: 2.6vh; height: 2.6vh; }
  #tabs.s4 .tab .tl.coll, #tabs.s5 .tab .tl.coll { width: 3.7vh; } #tabs.s4 .tab .tl.coll img, #tabs.s5 .tab .tl.coll img { left: 0.1vh; top: 0; width: 3.3vh; height: 3.3vh; }
  /* the NCAA logos are detailed, so they get a bigger rounded white tile instead of the small circle */

  .llg.coll img { left: 0.3vh; top: 0.1vh; width: 7.2vh; height: 7.2vh; }
  .llg.sm.coll { width: 5.6vh; height: 5.2vh; border-radius: 0.8vh; } .llg.sm.coll img { left: 0.2vh; top: 0; width: 5.2vh; height: 5.2vh; }
  .narrow .llg.coll { width: 6.2vh; height: 5.8vh; } .narrow .llg.coll img { left: 0.3vh; top: 0.1vh; width: 5.6vh; height: 5.6vh; }
  .ltag { margin-left: -0.3vw; }

  .llg.lone + .lalt + .ltag { margin-left: 0.8vw; }
  #crawl .nl .ltag { font-size: 0.75em; margin: 0; }
  .narrow .llg { width: 5vh; height: 5vh; margin-right: 0.7vw; } .narrow .llg img, .narrow .llg svg { width: 3.8vh; height: 3.8vh; left: 0.6vh; top: 0.6vh; }
  #crawllabel {

  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4vh; line-height: 4vh;
    padding: 0 2.5vw; font-size: 2.2vh; color: #555f78;
  }
  #foot .r { float: right; }

  /* =========== COLLEGE TOP 25 SCREEN =========== */
  .rank { padding: 0 0.6vw; }

    var soon = favGamesSoon(), isg = [], lab2 = { 'out': 'OUT', 'doubtful': 'DOUBTFUL', 'questionable': 'QUESTIONABLE', 'day-to-day': 'DAY-TO-DAY' };
    for (var si = 0; si < soon.length; si++) {
      var ig = soon[si].g, igl = soon[si].lg, inj = injuriesFor(ig), html2 = '';
      if (!inj) continue;
      var sides = [ig.teams.away, ig.teams.home], cps = compOf(ig) || {};
      for (var sd = 0; sd < 2; sd++) {
        var cp2 = sideComp(cps, sd ? 'home' : 'away'), tid2 = cp2 && cp2.team && cp2.team.id, rows2 = (tid2 && inj[tid2]) || [], by = {};
        for (var r2 = 0; r2 < rows2.length; r2++) { var k2 = rows2[r2].st; if (!by[k2]) by[k2] = []; if (by[k2].length < 4) by[k2].push(rows2[r2].name + (rows2[r2].pos ? ' (' + rows2[r2].pos + ')' : '')); }
        var parts = '';
        for (var kk in lab2) if (by[kk]) parts += '<b class="' + (kk === 'out' ? '' : 'q') + '">' + lab2[kk] + '</b>' + esc(by[kk].join(', '));
        var tnm = String(sides[sd].short || nickname(sides[sd].name) || sides[sd].abbreviation).toUpperCase();
        if (parts) html2 += '<span class="inj"><span class="it">' + esc(tnm) + ':</span>' + parts + '</span>';
      }
      // say which sport and game this is: "NFL INJURIES · KC @ CHI · CHIEFS: OUT ... · BEARS: OUT ..."
      if (html2) isg.push({ label: (LEAGUE_NAMES[igl] || String(igl).toUpperCase()) + ' INJURIES', lg: igl,
                            html: '<span class="ig">' + esc(ig.teams.away.abbreviation + ' @ ' + ig.teams.home.abbreviation) + '</span>' + html2 });
    }
    if (isg.length) groups.push(isg);
  }
  if (CONFIG.crawlNews && news.items.length) {
    var ns = [];
    for (var n = 0; n < news.items.length; n += 3) {
      var nh = '';
      for (var q = n; q < n + 3 && q < news.items.length; q++) {
        var it = news.items[q];
        nh += '<span class="n">' + '<span class="nl">' + leagueMarkHTML(it.lg, LEAGUE_NAMES[it.lg] || it.lg.toUpperCase(), 'llg sm') + '</span>' + esc(it.h) + '</span>';
      }
      ns.push({ label: 'HEADLINES', html: nh });
    }
    groups.push(ns);
  }
  // take turns: first segment of each league, then the second of each, and so on
  var out = [], more = true;
  for (var r = 0; more; r++) {
    more = false;
    for (var g = 0; g < groups.length; g++) if (groups[g][r]) { out.push(groups[g][r]); more = true; }
  }
  state.crawlSegs = out;                           // picked up when the current segment finishes
  if (!state.crawlRunning) playSegment(0);
}
function setX(el, x, secs) {
  el.style.webkitTransition = secs ? '-webkit-transform ' + secs + 's linear' : 'none';
  el.style.transition = secs ? 'transform ' + secs + 's linear' : 'none';
  el.style.webkitTransform = 'translateX(' + x + 'px)';
  el.style.transform = 'translateX(' + x + 'px)';
}
function playSegment(i) {
  var segs = state.crawlSegs || [], el = $('crawl');
  if (state.crawlTimer) { clearTimeout(state.crawlTimer); state.crawlTimer = null; }
  if (!segs.length) {
    el.innerHTML = ''; $('crawllabel').innerHTML = 'SCORES'; state.crawlRunning = false; return;
  }
  i = i % segs.length;
  state.crawlIdx = i;
  var seg = segs[i];
  var lnm = seg.lg && LEAGUE_NAMES[seg.lg], lab = esc(seg.label);
  if (lnm && seg.label.indexOf(lnm) === 0) lab = leagueMarkHTML(seg.lg, lnm, seg.label === lnm ? 'llg lone' : 'llg') + esc(seg.label.slice(lnm.length));
  $('crawllabel').innerHTML = lab;
  el.innerHTML = seg.html;
  var start = $('crawlbar').offsetWidth, w = el.offsetWidth;
  var secs = Math.max(4, Math.round((start + w) / CONFIG.crawlSpeed));
  setX(el, start, 0);                              // park just off the right edge
  void el.offsetWidth;
  setX(el, -w, secs);                              // scroll until fully off the left edge
  state.crawlRunning = true;
  state.crawlTimer = setTimeout(function () { playSegment(state.crawlIdx + 1); }, secs * 1000 + 300);
}

/* Saturday with a USC game = USC colors; every other day = Bears; once the Super Bowl is played
   (until the NFL is back) the Bears days go to the White Sox or the Bulls, whichever plays next */
function applyTheme(d) {
  var t = CONFIG.theme;
  if (t === 'auto') t = d.getDay() === 6 && uscPlaysToday() ? 'usc' : (nflOffseason() ? chiTeamNext(d) : 'bears');
  var cls = t === 'classic' ? '' : 't-' + t;
  var vw = window.innerWidth || document.documentElement.clientWidth, vh = window.innerHeight || document.documentElement.clientHeight;
  if (vh && vw / vh < 1.7) cls += (cls ? ' ' : '') + 'narrow';     // 16:10 and squarer
  if (!CONFIG.motion) cls += (cls ? ' ' : '') + 'nomotion';
  if (document.body.className !== cls) document.body.className = cls;
}

function renderClock() {
  var d = new Date();
  applyTheme(d);
  $('clock').innerHTML = '<small>' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + '</small>' + timeStr(d);
}

function renderFoot(errs) {
  var t = state.lastOk ? 'Updated ' + timeStr(state.lastOk) : 'Connecting…';
  if (errs) t += '  ·  ' + errs + ' league(s) failed to load, retrying';
  $('updated').innerHTML = esc(t) + (DEMO ? '  ·  DEMO DATA' : '');
}

/* ---------- main loop ---------- */
/* Swap leagues when the season-change date arrives (checked on every refresh). */
function applySeasonSwitch() {
  var s = CONFIG.seasonSwitch;
  if (!s || ymd(new Date()) < s.on) return;
  var out = [], i, added = inList(CONFIG.leagues, s.add);
  for (i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i];
    if (lg === s.remove) continue;
    out.push(lg);
    if (lg === s.after && !added) { out.push(s.add); added = true; }
  }
  if (!added) out.push(s.add);
  CONFIG.leagues = out;
  delete state.data[s.remove];
  CONFIG.seasonSwitch = null;                      // done
}

function refreshAll() {
  state.refreshing = true;
  applySeasonSwitch();
  var i = 0, errs = 0, anyLive = false;
  function next() {
    if (i >= CONFIG.leagues.length) return finished();
    var lg = CONFIG.leagues[i++];
    loadLeague(lg, function (err, res) {
      if (err) { errs++; return next(); }        // keep the last good data on screen
      fetchLines(lg, res.games, function () {
        for (var k = 0; k < res.games.length; k++) {
          res.games[k].open = lines[keyOf(res.games[k])] || null;
          var ex = extras[keyOf(res.games[k])] || {};
          res.games[k].extra = ex.all || '';
          res.games[k].sit = ex.sit || '';
          if (res.games[k].live) anyLive = true;
        }
        state.data[lg] = res;
        checkChampion(lg);
        next();
      });
    });
  }
  function finished() {
    saveLines();
    if (errs < CONFIG.leagues.length) { state.lastOk = new Date(); state.failures = 0; }
    else state.failures++;
    if (!state.lastOk && state.failures) {
      var m = $('msg'); m.style.display = 'block';
      m.innerHTML = 'Can&rsquo;t reach SportsBlaze<small>Check that this screen is connected to the internet. ' +
        'Retrying automatically&hellip;</small>';
    }
    var wait = state.failures ? 30 : (anyLive ? CONFIG.refreshLiveSec : CONFIG.refreshIdleSec);
    loadTeams(function () { loadNews(function () { loadPtDetails(function () { loadRankings(function () { loadStandings(function () { loadChiNext(function () { loadBracket(function () { loadInjuries(function () { loadNflLeaders(function () {
      var hit = detectJump();                     // a big play, or a score in a CLOSE game: go straight to it
      buildPages();
      var jumped = jumpTo(hit);
      refreshRender(jumped); if (jumped) scheduleRotate(); renderCrawl(); renderFoot(errs);
      state.refreshing = false;
      setTimeout(refreshAll, wait * 1000);
    }); }); }); }); }); }); }); }); });
  }
  next();
}

function rotate() {
  if (state.pages.length > 1) { state.pageIndex = (state.pageIndex + 1) % state.pages.length; renderPage(); }
  scheduleRotate();
}
function scheduleRotate() {                              // each screen can have its own hold time
  if (state.rotTimer) clearTimeout(state.rotTimer);
  var pg = state.pages[state.pageIndex];
  var secs = state.holdOnce || (pg && pg.hold) || CONFIG.rotateSec;
  state.holdOnce = 0; state.lastHold = secs;
  state.rotTimer = setTimeout(rotate, secs * 1000);
}

/* nudge everything a few pixels every 10 min to protect older screens from burn-in */
function antiBurn() {
  var s = $('shift');
  s.style.top = Math.round(Math.random() * 4 - 2) + 'px';
  s.style.left = Math.round(Math.random() * 4 - 2) + 'px';
}

    var k = keyOf(games[i]);
    if (!lines[k]) lines[k] = { side: i % 2 ? 'home' : 'away', line: '-' + (1.5 + i * 2), total: '' + (44.5 + i * 3) };

}
function demoEvents(lg, dateStr) {

  }[lg];
  if (!T) return [];

  if (lg === 'nfl' && dateStr !== ymd(addDays(new Date(), -3))) return [];
  if (lg === 'mlb' && dateStr !== today) return [];
  if (lg === 'nba' && dateStr !== today) return [];
  var out = [], base = new Date(); base.setHours(18, 30, 0, 0);
  for (var i = 0; i + 1 < T.length; i += 2) {
    var k = i / 2, live = lg !== 'nfl' && k % 3 !== 2, fin = lg === 'nfl' || k % 3 === 2;

    var ev = {

/* ---------- after the Super Bowl: White Sox or Bulls colors, whoever plays next ---------- */
var CHI_SCHED = { bulls: 'basketball/nba/teams/4/schedule', sox: 'baseball/mlb/teams/4/schedule' };   // ESPN team ids
var chiNext = { at: 0, bulls: 0, sox: 0 }, chiNextKey = 'fcw_chiNext';
try { var cn0 = JSON.parse(window.localStorage.getItem(chiNextKey)); if (cn0 && cn0.at) chiNext = cn0; } catch (e) {}
/* the NFL's season is over: Super Bowl decided (or ESPN says off-season), until next season's games show up */
function nflOffseason() {
  var c = champAt.nfl, now = new Date().getTime();
  if (c && now - c < 220 * 86400000) {
    var d = state.data.nfl;                                 // next season's games are here: Bears again
    if (d) for (var i = 0; i < d.games.length; i++) if (parseDate(d.games[i].date).getTime() > c + 60 * 86400000) return false;
    return true;
  }
  return seasonPhase.nfl === 4;
}
/* start time of the team's game that's on now or coming up next (0 = none found) */
function nextFromSchedule(data, now) {
  var evs = (data && data.events) || [], best = 0;
  for (var i = 0; i < evs.length; i++) {
    var c = evs[i].competitions && evs[i].competitions[0], st = c && c.status && c.status.type && c.status.type.state;
    var t = parseDate(evs[i].date || (c && c.date)).getTime();
    if (!t || st === 'post' || (st !== 'in' && t < now - 4 * 3600000)) continue;   // finished, or long past
    if (!best || t < best) best = t;
  }
  return best;
}
function loadChiNext(cb) {
  var now = new Date().getTime();
  if (DEMO || CONFIG.theme !== 'auto' || !nflOffseason() || now - chiNext.at < 60 * 60000) return cb();
  var got = { at: now, bulls: 0, sox: 0 }, keys = ['bulls', 'sox'], i = 0;
  function step() {
    if (i >= keys.length) {
      chiNext = got;
      try { window.localStorage.setItem(chiNextKey, JSON.stringify(got)); } catch (e) {}
      return cb();
    }
    var k = keys[i++];
    getJSON(ESPN_API + CHI_SCHED[k], function (err, data) {
      if (!err) got[k] = nextFromSchedule(data, now);
      if (k === 'bulls' && !got.bulls && !err) {             // regular season done: look at the playoff schedule
        return getJSON(ESPN_API + CHI_SCHED[k] + '?seasontype=3', function (e2, d2) { if (!e2) got.bulls = nextFromSchedule(d2, now); step(); });
      }
      step();
    });
  }
  step();
}
/* a game on right now wins; otherwise the sooner of the two next games; no schedule yet: by season */
function chiTeamNext(d) {
  var bl = state.data.nba, ml = state.data.mlb;
  function liveFav(data, lg) { if (data) for (var i = 0; i < data.games.length; i++) if (data.games[i].live && isFav(data.games[i], lg)) return true; return false; }
  if (liveFav(ml, 'mlb')) return 'sox';
  if (liveFav(bl, 'nba')) return 'bulls';
  var b = chiNext.bulls, s2 = chiNext.sox;
  if (b && s2) return b <= s2 ? 'bulls' : 'sox';
  if (b) return 'bulls';
  if (s2) return 'sox';
  var m = d.getMonth();                                      // nothing known yet: Bulls until April, then the Sox
  return m >= 3 && m <= 9 ? 'sox' : 'bulls';
}

/* ---------- fit any screen ----------
   The layout is built for sideways screens from 5:4 up to 21:9. On anything outside that
   (a phone or tablet held upright, a super-wide monitor), or when the edges need a safety
   margin (rounded corners, a notch, a TV that crops its edges: ?inset=3 = 3% each side),
   the ticker runs inside a frame of the right shape, centered with dark bars around it. */
var FIT = { min: 1.25, max: 2.4 };
function screenInsets() {
  var o = { t: 0, r: 0, b: 0, l: 0 }, m = window.location.search.match(/[?&]inset=([\d.]+)/);
  var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
  try {                                                  // phones/tablets with rounded corners or a notch report their safe area
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
                      'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)';
    document.body.appendChild(d);
    var cs = window.getComputedStyle(d);
    o = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    document.body.removeChild(d);
  } catch (e) {}
  if (m && +m[1] > 0) {
    var px = Math.min(+m[1], 15) / 100;
    o.t = Math.max(o.t, H * px); o.b = Math.max(o.b, H * px); o.l = Math.max(o.l, W * px); o.r = Math.max(o.r, W * px);
  }
  return o;
}
function needsFrame() {
  var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
  if (!W || !H) return false;
  var ins = screenInsets(), a = W / H;
  return a < FIT.min - 0.02 || a > FIT.max + 0.02 || ins.t + ins.r + ins.b + ins.l > 0;
}
var FRAMED = /[?&]framed=1/.test(window.location.search);
function buildFrame() {
  document.body.className = '';
  document.body.style.background = '#000';
  document.body.innerHTML = '';
  var f = document.createElement('iframe'), url = window.location.href.replace(/#.*$/, '');
  f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'framed=1';
  f.setAttribute('frameborder', '0'); f.setAttribute('scrolling', 'no');
  f.style.cssText = 'position:absolute;border:0;margin:0;padding:0;background:#05070d;overflow:hidden';
  document.body.appendChild(f);
  function place() {
    var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
    var ins = screenInsets(), aw = W - ins.l - ins.r, ah = H - ins.t - ins.b, w = aw, h = ah;
    if (aw / ah < FIT.min) h = Math.floor(aw / FIT.min); else if (aw / ah > FIT.max) w = Math.floor(ah * FIT.max);
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.style.left = Math.round(ins.l + (aw - w) / 2) + 'px'; f.style.top = Math.round(ins.t + (ah - h) / 2) + 'px';
  }
  place();
  window.addEventListener('resize', place);
  window.addEventListener('orientationchange', function () { setTimeout(place, 300); });
  setTimeout(function () { window.location.reload(); }, 6 * 3600000);   // same fresh start every 6 hours
}
var OUTER = !FRAMED && needsFrame();
if (!FRAMED) window.addEventListener('resize', function () {   // turned the screen or resized the window
  if (!OUTER && needsFrame()) window.location.reload();
});

/* ---------- start ---------- */
if (OUTER) buildFrame(); else {
readParams();
renderClock(); setInterval(renderClock, 10000);
$('msg').style.display = 'block';
refreshAll();
scheduleRotate();
setInterval(antiBurn, 10 * 60000);
if (CONFIG.fastRefreshSec) setInterval(fastRefresh, CONFIG.fastRefreshSec * 1000);   // Bears / USC live: every 10 s
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
}
</script>
