<!--

<style>

  // Season change: starting on this date, WNBA comes off and men's college basketball

  // Men's college basketball: 'top25' = games with a ranked team, 'all' = every Division I game
  cbb: 'top25',

  // College football: 'top25' = games with a ranked team, 'fbs' = every FBS game
  cfb: 'top25',

function buildPages() {

/* league tabs (and their screens) in the order their games are on: a league with a game on now first
   (earliest start first), then by the next start time; leagues with nothing left today keep their usual order */
function leagueOrder() {
  var arr = [], i, k;
  for (i = 0; i < CONFIG.leagues.length; i++) {
    var lg = CONFIG.leagues[i], wg = windowGames(lg), key = Infinity;
    for (k = 0; k < wg.length; k++) {
      var g = wg[k];
      if (isFinal(g) || /postpon|cancel/i.test((g.status || '') + ' ' + (g.detail || ''))) continue;
      var t = parseDate(g.date).getTime();
      if (!isNaN(t) && t < key) key = t;
    }
    arr.push({ lg: lg, key: key, idx: i });
  }
  arr.sort(function (a, b) { return a.key === b.key ? a.idx - b.idx : (a.key < b.key ? -1 : 1); });
  var out = [];
  for (i = 0; i < arr.length; i++) out.push(arr[i].lg);

}
function renderTabs(activeLg) {

  for (var c2 = 0; c2 < codes.length; c2++) {

  }

    var lg = order[i];

    var cls = 'tab' + (lg === activeLg ? ' on' : '') + (!windowGames(lg).length && !rankingsFor(lg) && !standingsPages(lg).length && !(lg === 'ncaab' && bracketPages().length) ? ' empty' : '');
    var tnm = LEAGUE_NAMES[lg] || lg.toUpperCase();

/* keep the tabs between the name and the clock; shrink them if there are too many */
function fitTabs() {
  var el = $('tabs'), b = $('brand'), c = $('clock');
  if (!el || !b || !c || !b.getBoundingClientRect) return;
  var W = window.innerWidth || document.documentElement.clientWidth, gap = Math.round(W * 0.01);
  var L = b.getBoundingClientRect().right + gap, R = c.getBoundingClientRect().left - gap;
  if (!(R > L)) return;
  var room = R - L, ctr = W / 2, half = Math.min(ctr - L, R - ctr);
  // centered on the screen when that fits, otherwise centered in the space that's free
  if (half * 2 >= room * 0.8) { el.style.left = (ctr - half) + 'px'; el.style.right = (W - ctr - half) + 'px'; }
  else { el.style.left = L + 'px'; el.style.right = (W - R) + 'px'; }
  var tabs = el.getElementsByTagName('span'), list = [];
  for (var i = 0; i < tabs.length; i++) if (/\btab\b/.test(tabs[i].className)) list.push(tabs[i]);
  if (!list.length) return;
  for (var s = 0; s <= 5; s++) {
    el.className = s ? 's' + s : '';
    var first = list[0].offsetTop, wrapped = false, w = 0;
    for (var j = 0; j < list.length; j++) { if (Math.abs(list[j].offsetTop - first) > list[0].offsetHeight / 2) wrapped = true; w += list[j].offsetWidth; }
    if (!wrapped && w <= el.clientWidth) return;
  }

/* =================== NFL PRIMETIME (SNF / MNF / TNF) ===================
   Evening NFL games on Sunday, Monday and Thursday get their own tab and a detailed
   screen. During the game it holds for CONFIG.primetimeHoldLive seconds and returns
   after every other screen; before kickoff / after the final it holds for
   CONFIG.primetimeHoldPre seconds once per loop. The tab is gone an hour after the final. */
var PT_NAMES = { 0: ['SNF', 'Sunday Night Football'], 1: ['MNF', 'Monday Night Football'], 4: ['TNF', 'Thursday Night Football'] };
var ptDetail = {}, FINAL_KEY = 'fcw_finalSeen', finalSeen = (function () {
  try { return JSON.parse(window.localStorage.getItem(FINAL_KEY)) || {}; } catch (e) { return {}; }
})();
/* first time this game was seen final (kept across page reloads, so the clock doesn't restart) */
function seenFinal(id, now) {
  if (!finalSeen[id]) {
    finalSeen[id] = now;
    for (var k in finalSeen) if (now - finalSeen[k] > 2 * 86400000) delete finalSeen[k];
    try { window.localStorage.setItem(FINAL_KEY, JSON.stringify(finalSeen)); } catch (e) {}
  }
  return finalSeen[id];
}
function ptKind(g) {
  var d = parseDate(g.date), k = PT_NAMES[d.getDay()];

}
/* Featured games with their own tab + detailed screen: NFL primetime and World Series games */
/* Championship series (World Series, NBA Finals, Stanley Cup Final, WNBA Finals): every game gets the
   big screen all game day, like football, not just the last 4 hours */
var TITLE_SERIES = [['mlb', /WORLD SERIES/, 'WS', 'World Series'], ['nba', /NBA FINALS|^FINALS/, 'FINALS', 'NBA Finals'],
                    ['nhl', /STANLEY CUP FINAL/, 'CUP FINAL', 'Stanley Cup Final'], ['wnba', /WNBA FINALS|^FINALS/, 'FINALS', 'WNBA Finals']];
function titleGames() {
  var out = [], now = new Date().getTime(), today = ymd(new Date());
  for (var k = 0; k < TITLE_SERIES.length; k++) {
    var T = TITLE_SERIES[k], d = state.data[T[0]];
    if (!d || !inList(CONFIG.leagues, T[0])) continue;
    for (var i = 0; i < d.games.length; i++) {
      var g = d.games[i];
      if (!T[1].test(g.tag || '')) continue;
      if (isFinal(g)) {
        seenFinal(g.id, now);

var crawlFull = {}, CRAWL_FULL = { ncaaf: '&groups=80&limit=300', ncaab: '&groups=50&limit=400' };
function loadCrawlFull(cb) {
  var todo = [], now = new Date().getTime(), day = ymd(new Date(now - 4 * 3600000)).replace(/-/g, '');
  for (var lg in CRAWL_FULL) {
    if (DEMO || !CONFIG.crawlAllCollege || !inList(CONFIG.leagues, lg) || seasonOver(lg)) { delete crawlFull[lg]; continue; }
    if ((lg === 'ncaaf' && CONFIG.cfb === 'fbs') || (lg === 'ncaab' && CONFIG.cbb === 'all')) { delete crawlFull[lg]; continue; }   // the main feed has them all
    var c = crawlFull[lg];

    todo.push(lg);

  var k = 0;

    if (k >= todo.length) return cb();
    var lg2 = todo[k++];
    getJSON(ESPN_API + ESPN_PATHS[lg2] + '/scoreboard?dates=' + day + CRAWL_FULL[lg2], function (err, data) {
      if (!err && data && data.events) {

}

}

function setX(el, x, secs) {

  el.style.transition = secs ? 'transform ' + secs + 's linear' : 'none';

  }

/* Colors by game day: the Bears, USC or Wisconsin colors on the days they play; after the Super Bowl,
   the Bulls or White Sox colors on their game days. USC and Wisconsin keep their colors the whole day
   they play (midnight to midnight, or an hour after the final if it runs past midnight); the others
   from the morning until an hour after the final. USC and Wisconsin both playing: USC. Every other
   day: the house colors (navy + gold with the Bears orange lines). Two others on the same day: the
   game that's on now wins, then the next one to start, then the one that just ended. */
var THEME_TEAMS = [['bears', 'nfl', ['CHI']], ['usc', 'ncaaf', ['USC']], ['wis', 'ncaaf', ['WIS']]];
var THEME_OFFSEASON = [['bulls', 'nba', ['CHI']], ['sox', 'mlb', ['CHW', 'CWS']]];

function gameDayTheme() {
  var now = new Date().getTime(), today = ymd(new Date()), list = THEME_TEAMS.concat(nflOffseason() ? THEME_OFFSEASON : []), sc = {}, k, i;
  for (k = 0; k < list.length; k++) {
    var d = state.data[list[k][1]], key = list[k][0];
    if (!d) continue;
    for (i = 0; i < d.games.length; i++) {
      var g = d.games[i];
      if (!inList(list[k][2], g.teams.away.abbreviation) && !inList(list[k][2], g.teams.home.abbreviation)) continue;
      if (/postpon|cancel/i.test((g.status || '') + ' ' + (g.detail || ''))) continue;
      var t = parseDate(g.date).getTime(), score = 0, isToday = ymd(new Date(t)) === today;
      if (g.live) score = 3e13;                                        // on right now
      else if (isFinal(g)) {
        var fs = seenFinal(g.id, now);
        if (now - fs <= 60 * 60000 && now - t < 4.5 * 3600000) score = 1e13 - (now - fs);   // ended within the hour
        else if (isToday && inList(THEME_ALLDAY, key)) score = 1;      // USC / Wisconsin: the rest of their game day
      }
      else if (isToday) score = 2e13 - t / 1000;                       // later today: the soonest wins
      if (score > (sc[key] || 0)) sc[key] = score;
    }
  }
  var best = null, bestScore = 0;
  for (k in sc) {
    if (THEME_OVER[k] && sc[THEME_OVER[k]]) continue;                 // Wisconsin on a USC game day: USC
    if (sc[k] > bestScore) { bestScore = sc[k]; best = k; }
  }
  return best;
}
function applyTheme(d) {

  if (vh && vw / vh < 1.7) cls += (cls ? ' ' : '') + 'narrow';     // 16:10 and squarer
  if (!CONFIG.motion) cls += (cls ? ' ' : '') + 'nomotion';

}

/* Swap leagues when the season-change date arrives (checked on every refresh). */
function applySeasonSwitch() {

  for (i = 0; i < CONFIG.leagues.length; i++) {

}

  var hlEv = ['click', 'keydown', 'touchstart', 'mousedown'];
  for (var hli = 0; hli < hlEv.length; hli++) document.addEventListener(hlEv[hli], hlUnlock, true);
}
if (CONFIG.sound) {
  var sndEv = ['click', 'keydown', 'touchstart', 'mousedown'];
  for (var sni = 0; sni < sndEv.length; sni++) document.addEventListener(sndEv[sni], soundUnlock, true);
  soundNote();
}
refreshAll();
scheduleRotate();
setInterval(antiBurn, 10 * 60000);
if (CONFIG.fastRefreshSec) setInterval(fastRefresh, CONFIG.fastRefreshSec * 1000);   // Bears / USC live: every 10 s
setTimeout(function () { window.location.reload(); }, 6 * 3600000); // fresh start every 6 hours
}
</script>
</body>
</html>
