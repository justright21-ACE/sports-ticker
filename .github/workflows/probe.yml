name: probe
on: { push: { branches: [probe-espn] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})))
          for u in ['https://site.web.api.espn.com/apis/site/v3/sports/basketball/nba/leaders?season=2027&seasontype=2',
                    'https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/seasons/2027/types/2/leaders?limit=5']:
              try:
                  d=get(u); print('OK', u, list(d.keys()))
                  found=[]
                  def walk(o,dep=0):
                      if dep>7: return
                      if isinstance(o,list):
                          for x in o: walk(x,dep+1)
                      elif isinstance(o,dict):
                          if o.get('name') and isinstance(o.get('leaders'),list) and o['leaders']:
                              l=o['leaders'][0]; a=l.get('athlete',{})
                              found.append((o['name'], o.get('displayName') or o.get('shortDisplayName'), l.get('displayValue'), a.get('displayName') or a.get('$ref','')[-60:], (a.get('team') or l.get('team') or {}).get('abbreviation') or str(l.get('team',''))[:80]))
                          for k,v in o.items():
                              if k!='leaders': walk(v,dep+1)
                  walk(d)
                  for f in found: print('  ', f)
              except urllib.error.HTTPError as ex: print('ERR', u, ex.code)
          PY
