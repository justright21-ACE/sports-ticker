name: probe
on: { push: { branches: [probe-espn] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          H={'User-Agent': 'Mozilla/5.0'}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H)))
          def head(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u, headers=H)); return r.status, r.headers.get('Content-Type'), len(r.read())
              except urllib.error.HTTPError as ex: return ex.code
          for pid in ['22774','45843']:
              for u in ['https://a.espncdn.com/i/headshots/soccer/players/full/%s.png','https://a.espncdn.com/combiner/i?img=/i/headshots/soccer/players/full/%s.png&w=350&h=254']:
                  print(pid, u[:60], head(u % pid))
          try:
              s=get('https://site.web.api.espn.com/apis/common/v3/search?query=cristiano%20ronaldo&limit=5&type=player')
              for it in s.get('items',[]): print('search', it.get('id'), it.get('displayName'), it.get('sport'), it.get('league'), json.dumps(it.get('headshot',''))[:160])
          except Exception as ex: print('search err', ex)
          t=get('https://site.api.espn.com/apis/site/v2/sports/soccer/ksa.1/teams')
          for x in t['sports'][0]['leagues'][0]['teams']:
              tm=x['team']
              if 'Nassr' in tm['displayName']:
                  r=get('https://site.api.espn.com/apis/site/v2/sports/soccer/ksa.1/teams/%s/roster' % tm['id'])
                  for a in r.get('athletes',[]):
                      if 'Ronaldo' in a.get('displayName',''): print('roster', a.get('id'), a.get('displayName'), json.dumps(a.get('headshot'))[:200])
          a=None
          for u in ['https://sports.core.api.espn.com/v2/sports/soccer/athletes/22774','https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/22774']:
              try: a=get(u); print('athlete', u[-60:], a.get('displayName') or (a.get('athlete') or {}).get('displayName'), json.dumps(a.get('headshot') or (a.get('athlete') or {}).get('headshot'))[:200])
              except urllib.error.HTTPError as ex: print('athlete err', u, ex.code)
          PY
